<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicación Modular Pro - Gestión de Marcadores</title>
    <link id="app-favicon" rel="icon" href="">
    
    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
    
        <link rel="manifest" href="./manifest.json">
    <script src="./scripts/app.js"></script>
    <link rel="stylesheet" href="./styles/style.css">
    
    <style>
        :root { --transition-speed: 0.3s; }
        
        /* Dark Mode Override Rules (Only active when .dark class is on body) */
        body.dark {
            background-color: #0f172a;
            color: #f1f5f9;
        }
        body.dark header, 
        body.dark nav, 
        body.dark aside, 
        body.dark footer, 
        body.dark .window-card {
            background-color: #1e293b !important;
            border-color: #334155 !important;
            color: #f1f5f9 !important;
        }
        body.dark main {
            background-color: #0f172a !important;
            background-image: radial-gradient(#334155 1px, transparent 1px) !important;
        }
        body.dark .window-header {
            background-color: #334155 !important;
            border-bottom-color: #475569 !important;
        }
        body.dark input, 
        body.dark select, 
        body.dark textarea {
            background-color: #0f172a !important;
            color: #f1f5f9 !important;
            border-color: #334155 !important;
        }
        body.dark .inspector-section-header {
            background-color: #334155 !important;
            color: #cbd5e1 !important;
        }

        /* Layout & Collapsible Mechanics */
        body { overflow: hidden; height: 100vh; display: flex; flex-direction: column; transition: background-color 0.3s ease; }
        .collapsible { transition: all var(--transition-speed) ease-in-out; overflow: hidden; position: relative; }
        .collapsed-h { height: 0 !important; min-height: 0 !important; padding: 0 !important; margin: 0 !important; border: 0 !important; }
        .collapsed-w { width: 0 !important; min-width: 0 !important; padding: 0 !important; margin: 0 !important; border: 0 !important; }
        
        .nav-expanded { width: 256px; min-width: 256px; }
        .nav-collapsed { width: 64px; min-width: 64px; }
        .nav-collapsed .nav-text, .nav-collapsed .nav-header-text, .nav-collapsed .win-controls, .nav-collapsed .nav-input-group { display: none !important; }
        .nav-collapsed .nav-item-btn { justify-content: center; padding-left: 0; padding-right: 0; }
        
        main { flex: 1; overflow: auto; position: relative; background-image: radial-gradient(#e5e7eb 1px, transparent 1px); background-size: 20px 20px; }
        
        .window-card { 
            position: absolute; 
            width: 600px; 
            height: 450px; 
            background: white; 
            border: 1px solid #cbd5e1; 
            border-radius: 8px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); 
            display: flex; 
            flex-direction: column; 
            z-index: 10; 
            overflow: hidden; 
            transition: width 0.2s, height 0.2s, top 0.2s, left 0.2s; 
        }
        .window-header { padding: 8px 12px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; cursor: move; display: flex; justify-content: space-between; align-items: center; user-select: none; }
        .window-body { flex: 1; overflow: hidden; position: relative; background: #ffffff; }
        .window-body iframe { width: 100%; height: 100%; border: none; background: white; }
        
        /* Window States */
        .window-maximized { top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important; border-radius: 0; }

        .btn-win-tool { padding: 4px; border-radius: 4px; transition: background-color 0.2s; display: flex; items-center; justify-content: center; color: #64748b; }
        .btn-win-tool:hover { background-color: #e2e8f0; color: #0f172a; }
        body.dark .btn-win-tool:hover { background-color: #475569; color: #f1f5f9; }

        .inspector-section-header { cursor: pointer; display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; background: #f1f5f9; border-bottom: 1px solid #e2e8f0; font-size: 10px; font-weight: bold; color: #475569; text-transform: uppercase; }
        .inspector-section-header:hover { background: #e2e8f0; }
        .inspector-section-content { display: none; padding: 8px; background: #fff; font-family: 'Fira Code', monospace; font-size: 10px; overflow-x: auto; }
        .inspector-section-content.active { display: block; }

        .code-snippet { background: #fafafa; border: 1px solid #eee; padding: 8px; border-radius: 4px; white-space: pre-wrap; word-break: break-all; font-size: 9px; color: #334155; max-height: 200px; overflow-y: auto; }
        
        .ins-tab-btn { padding: 4px 8px; font-size: 9px; font-weight: bold; border-bottom: 2px solid transparent; color: #94a3b8; cursor: pointer; }
        .ins-tab-btn.active { border-color: #3b82f6; color: #3b82f6; }
        .ins-tab-content { display: none; margin-top: 8px; }
        .ins-tab-content.active { display: block; }
        .preview-mini-frame { width: 100%; height: 120px; border: 1px solid #e2e8f0; border-radius: 4px; background: white; }

        .dom-tree-node { margin-left: 12px; border-left: 1px dashed #cbd5e1; padding-left: 8px; }
        .dom-tree-label { display: flex; align-items: center; gap: 4px; padding: 2px 0; }
        .dom-tree-toggle { cursor: pointer; width: 12px; font-size: 8px; display: inline-block; }
        
        .btn-nav-locked { opacity: 0.4; cursor: not-allowed !important; pointer-events: none; }
        .iframe-overlay { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 20; }
        .ui-draggable-dragging .iframe-overlay, .ui-resizable-resizing .iframe-overlay { display: block !important; }

        .expand-trigger { position: absolute; background: white; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); z-index: 50; display: none; transition: opacity 0.2s; cursor: pointer; }
    </style>

    <template id="templ-excel">
        <!DOCTYPE html>
        <html lang="es" class="h-full bg-slate-50">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Excel Studio - Web Spreadsheet App</title>
            <!-- Tailwind CSS -->
            <script src="https://cdn.tailwindcss.com"></script>
            <script>
                tailwind.config = {
                    darkMode: 'class',
                    theme: {
                        extend: {
                            colors: {
                                excel: {
                                    50: '#f0fdf4',
                                    100: '#dcfce7',
                                    500: '#22c55e',
                                    600: '#16a34a',
                                    700: '#15803d',
                                    800: '#166534',
                                    900: '#14532d',
                                    dark: '#0e4a26'
                                }
                            }
                        }
                    }
                }
            </script>
            <!-- Dexie.js (IndexedDB Wrapper) -->
            <script src="https://cdn.jsdelivr.net/npm/dexie@3.2.4/dist/dexie.min.js"></script>
            <!-- SheetJS (Excel Parse & Export) -->
            <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
            <!-- Lucide Icons -->
            <script src="https://unpkg.com/lucide@latest"></script>

            <style>
                /* Custom scrollbar for grid */
                ::-webkit-scrollbar {
                    width: 8px;
                    height: 8px;
                }
                ::-webkit-scrollbar-track {
                    background: #f1f5f9;
                }
                ::-webkit-scrollbar-thumb {
                    background: #cbd5e1;
                    border-radius: 4px;
                }
                ::-webkit-scrollbar-thumb:hover {
                    background: #94a3b8;
                }

                /* Spreadsheet grid custom styles */
                .excel-grid {
                    border-collapse: separate;
                    border-spacing: 0;
                    user-select: none;
                }
                .excel-cell-header {
                    background-color: #f8fafc;
                    color: #475569;
                    font-weight: 600;
                    font-size: 11px;
                    text-align: center;
                    border-right: 1px solid #cbd5e1;
                    border-bottom: 1px solid #cbd5e1;
                    position: sticky;
                    z-index: 10;
                }
                .excel-cell-header.col-header {
                    top: 0;
                    height: 26px;
                }
                .excel-cell-header.row-header {
                    left: 0;
                    width: 42px;
                    min-width: 42px;
                    z-index: 20;
                }
                .excel-cell-header.top-left-corner {
                    top: 0;
                    left: 0;
                    z-index: 30;
                    width: 42px;
                    height: 26px;
                    border-right: 2px solid #94a3b8;
                    border-bottom: 2px solid #94a3b8;
                }
                .excel-cell {
                    border-right: 1px solid #e2e8f0;
                    border-bottom: 1px solid #e2e8f0;
                    min-width: 90px;
                    height: 26px;
                    padding: 2px 6px;
                    font-size: 13px;
                    white-space: nowrap;
                    overflow: hidden;
                    text-overflow: ellipsis;
                    outline: none;
                    background-color: #ffffff;
                    transition: background-color 0.1s ease;
                }
                .excel-cell.selected {
                    outline: 2px solid #16a34a !important;
                    outline-offset: -2px;
                    z-index: 5;
                    position: relative;
                }
                .excel-cell.editing {
                    outline: 2px solid #2563eb !important;
                    outline-offset: -2px;
                    background-color: #ffffff !important;
                    z-index: 25;
                }
                .excel-cell.in-range {
                    background-color: #dcfce7 !important;
                }

                /* Ribbon tabs styling */
                .ribbon-tab-btn.active {
                    border-bottom: 3px solid #16a34a;
                    color: #15803d;
                    font-weight: 600;
                }

                /* Modal backdrop transition */
                .modal-fade {
                    transition: opacity 0.2s ease-in-out;
                }
            </style>
        </head>
        <body class="h-full font-sans text-slate-800 flex flex-col overflow-hidden select-none bg-slate-100">

            <!-- Top Navigation Header -->
            <header class="bg-excel-800 text-white flex items-center justify-between px-4 py-2 shadow-md z-30">
                <div class="flex items-center space-x-3">
                    <div class="bg-white p-1.5 rounded-lg shadow-sm text-excel-800 flex items-center justify-center">
                        <i data-lucide="file-spreadsheet" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <div class="flex items-center space-x-2">
                            <h1 class="font-bold text-lg leading-none tracking-wide">Excel Studio</h1>
                            <span class="bg-excel-700 text-excel-100 text-xs px-2 py-0.5 rounded-full font-mono">v2.5 Local</span>
                        </div>
                        <p id="doc-title-display" class="text-xs text-excel-100 font-medium cursor-pointer hover:underline flex items-center mt-0.5" onclick="promptRenameWorkbook()">
                            <span id="current-workbook-name">Libro Sin Título</span>
                            <i data-lucide="edit-2" class="w-3 h-3 ml-1 opacity-70"></i>
                        </p>
                    </div>
                </div>

                <!-- Middle Action Bar / View Switcher -->
                <div class="flex items-center bg-excel-900/60 p-1 rounded-lg border border-excel-700/50">
                    <button id="btn-view-dashboard" onclick="switchView('dashboard')" class="px-3 py-1 rounded text-xs font-semibold flex items-center space-x-1.5 transition bg-excel-600 text-white shadow-sm">
                        <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                        <span>Panel</span>
                    </button>
                    <button id="btn-view-editor" onclick="switchView('editor')" class="px-3 py-1 rounded text-xs font-semibold flex items-center space-x-1.5 transition text-excel-100 hover:text-white hover:bg-excel-700/50">
                        <i data-lucide="table" class="w-4 h-4"></i>
                        <span>Editor</span>
                    </button>
                </div>

                <!-- Right Quick Actions & Auto-save Indicator -->
                <div class="flex items-center space-x-3">
                    <!-- Background Worker Status Badge -->
                    <div id="autosave-status" class="hidden md:flex items-center space-x-1.5 bg-excel-900/80 px-2.5 py-1 rounded-full text-xs font-medium border border-excel-600/40">
                        <span class="relative flex h-2 w-2">
                        <span id="autosave-ping" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span id="autosave-dot" class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                        </span>
                        <span id="autosave-text" class="text-excel-100">Autoguardado activo</span>
                    </div>

                    <!-- Quick Undo/Redo & Save -->
                    <div class="flex items-center space-x-1 border-l border-excel-700 pl-3">
                        <button onclick="undo()" title="Deshacer (Ctrl+Z)" class="p-1.5 hover:bg-excel-700 rounded transition text-excel-100 hover:text-white">
                            <i data-lucide="undo" class="w-4 h-4"></i>
                        </button>
                        <button onclick="redo()" title="Rehacer (Ctrl+Y)" class="p-1.5 hover:bg-excel-700 rounded transition text-excel-100 hover:text-white">
                            <i data-lucide="redo" class="w-4 h-4"></i>
                        </button>
                        <button onclick="saveCurrentWorkbook(true)" title="Guardar ahora (Ctrl+S)" class="px-2.5 py-1 bg-emerald-500 hover:bg-emerald-600 text-white rounded text-xs font-bold flex items-center space-x-1 transition shadow">
                            <i data-lucide="save" class="w-3.5 h-3.5"></i>
                            <span class="hidden sm:inline">Guardar</span>
                        </button>
                    </div>

                    <!-- Keyboard Help Button -->
                    <button onclick="toggleShortcutsModal(true)" title="Atajos de teclado (Ctrl+/)" class="p-1.5 bg-excel-700 hover:bg-excel-600 rounded-full transition text-white">
                        <i data-lucide="help-circle" class="w-4 h-4"></i>
                    </button>
                </div>
            </header>

            <!-- MAIN CONTAINER -->
            <main class="flex-1 relative overflow-hidden flex flex-col">

                <!-- DASHBOARD VIEW -->
                <div id="view-dashboard" class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto w-full space-y-8">
                    
                    <!-- Hero / Quick Templates Banner -->
                    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                            <div>
                                <h2 class="text-2xl font-bold text-slate-800">Bienvenido a Excel Studio</h2>
                                <p class="text-slate-500 text-sm mt-1">Crea un nuevo libro, usa una plantilla profesional o importa tus archivos de Excel (.xlsx, .xls, .csv).</p>
                            </div>
                            <!-- Import File Trigger -->
                            <div class="flex items-center space-x-3">
                                <label title="Cargar archivo Excel o CSV" class="cursor-pointer bg-excel-700 hover:bg-excel-800 text-white font-semibold text-sm px-4 py-2.5 rounded-xl flex items-center space-x-2 transition shadow-sm hover:shadow">
                                    <i data-lucide="upload-cloud" class="w-5 h-5"></i>
                                    <span>Importar Archivo</span>
                                    <input type="file" id="excel-file-input" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleFileImport(event)">
                                </label>
                                <button onclick="createNewBlankWorkbook()" class="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold text-sm px-4 py-2.5 rounded-xl flex items-center space-x-2 transition shadow-sm">
                                    <i data-lucide="plus" class="w-5 h-5 text-excel-600"></i>
                                    <span>Nuevo en Blanco</span>
                                </button>
                            </div>
                        </div>

                        <!-- Template Gallery -->
                        <div>
                            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Plantillas Predefinidas</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                <!-- Template 1: Presupuesto -->
                                <div onclick="loadTemplate('budget')" class="group cursor-pointer bg-slate-50 hover:bg-excel-50 border border-slate-200 hover:border-excel-500 rounded-xl p-4 transition-all duration-200">
                                    <div class="w-10 h-10 rounded-lg bg-emerald-100 text-emerald-700 flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
                                        <i data-lucide="pie-chart" class="w-5 h-5"></i>
                                    </div>
                                    <h4 class="font-bold text-slate-800 text-sm group-hover:text-excel-700">Presupuesto Familiar</h4>
                                    <p class="text-slate-500 text-xs mt-1">Gestión de ingresos, gastos fijos, variables y saldos calculados.</p>
                                </div>
                                <!-- Template 2: Ventas -->
                                <div onclick="loadTemplate('sales')" class="group cursor-pointer bg-slate-50 hover:bg-excel-50 border border-slate-200 hover:border-excel-500 rounded-xl p-4 transition-all duration-200">
                                    <div class="w-10 h-10 rounded-lg bg-blue-100 text-blue-700 flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
                                        <i data-lucide="trending-up" class="w-5 h-5"></i>
                                    </div>
                                    <h4 class="font-bold text-slate-800 text-sm group-hover:text-excel-700">Reporte de Ventas</h4>
                                    <p class="text-slate-500 text-xs mt-1">Control de productos, unidades, IVA y métricas de facturación.</p>
                                </div>
                                <!-- Template 3: Proyectos -->
                                <div onclick="loadTemplate('projects')" class="group cursor-pointer bg-slate-50 hover:bg-excel-50 border border-slate-200 hover:border-excel-500 rounded-xl p-4 transition-all duration-200">
                                    <div class="w-10 h-10 rounded-lg bg-purple-100 text-purple-700 flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
                                        <i data-lucide="kanban" class="w-5 h-5"></i>
                                    </div>
                                    <h4 class="font-bold text-slate-800 text-sm group-hover:text-excel-700">Control de Proyectos</h4>
                                    <p class="text-slate-500 text-xs mt-1">Seguimiento de tareas, responsables, estado y porcentaje de avance.</p>
                                </div>
                                <!-- Template 4: Hoja en blanco -->
                                <div onclick="createNewBlankWorkbook()" class="group cursor-pointer bg-slate-50 hover:bg-excel-50 border border-slate-200 hover:border-excel-500 rounded-xl p-4 transition-all duration-200">
                                    <div class="w-10 h-10 rounded-lg bg-amber-100 text-amber-700 flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
                                        <i data-lucide="file" class="w-5 h-5"></i>
                                    </div>
                                    <h4 class="font-bold text-slate-800 text-sm group-hover:text-excel-700">Hoja Limpia</h4>
                                    <p class="text-slate-500 text-xs mt-1">Libro de trabajo vacío con cuadrícula estándar de 100 filas por 26 columnas.</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Recent Workbooks & IndexedDB Storage Info -->
                    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 pb-4">
                            <div>
                                <h3 class="text-lg font-bold text-slate-800 flex items-center space-x-2">
                                    <i data-lucide="clock" class="w-5 h-5 text-slate-500"></i>
                                    <span>Libros Recientes Guardados</span>
                                </h3>
                                <p class="text-xs text-slate-500 mt-0.5">Almacenados en el navegador localmente mediante IndexedDB (Dexie.js)</p>
                            </div>

                            <!-- Search & Storage usage -->
                            <div class="flex items-center space-x-3">
                                <div class="relative">
                                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-slate-400"></i>
                                    <input type="text" id="dashboard-search" oninput="renderRecentWorkbooks()" placeholder="Buscar archivo..." class="pl-9 pr-3 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-excel-500 w-48 sm:w-64">
                                </div>
                                <div title="Uso estimado del almacenamiento local IndexedDB" class="hidden lg:flex items-center space-x-2 bg-slate-100 px-3 py-1.5 rounded-lg text-xs text-slate-600 font-mono">
                                    <i data-lucide="database" class="w-4 h-4 text-slate-500"></i>
                                    <span id="storage-usage-text">0.0 MB usados</span>
                                </div>
                            </div>
                        </div>

                        <!-- Recent Files Grid -->
                        <div id="recent-workbooks-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            <!-- Populated dynamically via JS -->
                        </div>
                    </div>
                </div>

                <!-- SPREADSHEET EDITOR VIEW -->
                <div id="view-editor" class="flex-1 hidden flex-col overflow-hidden bg-white">
                    
                    <!-- RIBBON CONTROL PANEL -->
                    <div class="bg-slate-50 border-b border-slate-200 flex flex-col shadow-sm">
                        <!-- Ribbon Tabs Navigation -->
                        <div class="flex items-center space-x-1 px-3 pt-1 border-b border-slate-200 bg-slate-100 text-xs font-medium text-slate-600">
                            <button onclick="setRibbonTab('home')" id="tab-btn-home" class="ribbon-tab-btn px-3 py-1.5 hover:text-slate-900 transition active">Inicio</button>
                            <button onclick="setRibbonTab('formulas')" id="tab-btn-formulas" class="ribbon-tab-btn px-3 py-1.5 hover:text-slate-900 transition">Fórmulas</button>
                            <button onclick="setRibbonTab('view')" id="tab-btn-view" class="ribbon-tab-btn px-3 py-1.5 hover:text-slate-900 transition">Vista</button>
                            <button onclick="setRibbonTab('export')" id="tab-btn-export" class="ribbon-tab-btn px-3 py-1.5 hover:text-slate-900 transition">Exportar</button>
                        </div>

                        <!-- Ribbon Toolbar Content -->
                        <div class="p-2 overflow-x-auto flex items-center space-x-4 text-slate-700 text-xs">
                            
                            <!-- TAB 1: INICIO (Formatting & Controls) -->
                            <div id="ribbon-content-home" class="flex items-center space-x-3">
                                <!-- Font styling group -->
                                <div class="flex items-center space-x-1 bg-white p-1 rounded border border-slate-200 shadow-2xs">
                                    <button onclick="applyFormat('bold')" title="Negrita (Ctrl+B)" class="p-1.5 hover:bg-slate-100 rounded text-slate-700 font-bold">
                                        <i data-lucide="bold" class="w-4 h-4"></i>
                                    </button>
                                    <button onclick="applyFormat('italic')" title="Cursiva (Ctrl+I)" class="p-1.5 hover:bg-slate-100 rounded text-slate-700 italic">
                                        <i data-lucide="italic" class="w-4 h-4"></i>
                                    </button>
                                    <button onclick="applyFormat('underline')" title="Subrayado (Ctrl+U)" class="p-1.5 hover:bg-slate-100 rounded text-slate-700 underline">
                                        <i data-lucide="underline" class="w-4 h-4"></i>
                                    </button>
                                    <button onclick="applyFormat('strike')" title="Tachado" class="p-1.5 hover:bg-slate-100 rounded text-slate-700 line-through">
                                        <i data-lucide="strikethrough" class="w-4 h-4"></i>
                                    </button>

            <!-- TOAST NOTIFICATIONS CONTAINER -->
            <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none">
                <!-- Toasts injected dynamically -->
            </div>

            <script>
                /* ==========================================================================
                1. DATABASE INITIALIZATION (Dexie.js) & BACKGROUND WEB WORKER SETUP
                ========================================================================== */
                
                // Initialize IndexedDB Database using Dexie
                const db_excel_2 = new Dexie("ExcelStudioDB");
                db_excel_2.version(1).stores({
                    workbooks: '++id, title, updatedAt, createdAt'
                });

                // Create Background Web Worker inline via Blob
                const workerScript = `
                    self.onmessage = function(e) {
                        const { type, payload } = e.data;
                        if (type === 'PROCESS_AUTOSAVE') {
                            // Perform background compression and validation checks
                            const jsonStr = JSON.stringify(payload);
                            const bytes = jsonStr.length;
                            const timestamp = new Date().toLocaleTimeString();
                            
                            // Respond back to main thread
                            self.postMessage({
                                type: 'AUTOSAVE_COMPLETE',
                                timestamp: timestamp,
                                bytesSaved: bytes,
                                workbookId: payload.id
                            });
                        }
                    };
                `;
                const blob = new Blob([workerScript], { type: 'application/javascript' });
                const autoSaveWorker = new Worker(URL.createObjectURL(blob));

                // Listen for worker messages
                autoSaveWorker.onmessage = function(e) {
                    const { type, timestamp, bytesSaved } = e.data;
                    if (type === 'AUTOSAVE_COMPLETE') {
                        const textEl = document.getElementById('autosave-text');
                        const dotEl = document.getElementById('autosave-dot');
                        if (textEl) {
                            textEl.innerText = `Guardado a las ${timestamp}`;
                        }
                        if (dotEl) {
                            dotEl.classList.add('bg-emerald-400');
                        }
                    }
                };

                /* ==========================================================================
                2. GLOBAL APPLICATION STATE
                ========================================================================== */
                let state2 = {
                    currentView: 'dashboard',
                    activeRibbonTab: 'home',
                    currentWorkbook: null, // Holds complete workbook object
                    activeSheetIndex: 0,
                    selectedCell: { row: 1, col: 1 },
                    editingCell: null,
                    zoomLevel: 1.0,
                    undoStack: [],
                    redoStack: []
                };

                // Default dimensions
                const DEFAULT_ROWS = 100;
                const DEFAULT_COLS = 26; // A to Z

                /* ==========================================================================
                3. FORMULA EVALUATOR ENGINE
                ========================================================================== */
                
                // Convert Column Index (1-based) to Name (1 -> A, 26 -> Z)
                function colToName(col) {
                    let temp, letter = '';
                    while (col > 0) {
                        temp = (col - 1) % 26;
                        letter = String.fromCharCode(65 + temp) + letter;
                        col = (col - temp - 1) / 26;
                    }
                    return letter;
                }

                // Convert Name to Column Index (A -> 1, Z -> 26)
                function nameToCol(name) {
                    let col = 0;
                    const str = name.toUpperCase();
                    for (let i = 0; i < str.length; i++) {
                        col = col * 26 + (str.charCodeAt(i) - 64);
                    }
                    return col;
                }

                // Parse Cell Reference string like "A1" into { row: 1, col: 1 }
                function parseCellRef(ref) {
                    const match = ref.toUpperCase().match(/^([A-Z]+)(\d+)$/);
                    if (!match) return null;
                    return {
                        col: nameToCol(match[1]),
                        row: parseInt(match[2], 10)
                    };
                }

                // Evaluate formula string safely
                function evaluateFormula(formulaStr, sheetCells) {
                    if (!formulaStr.startsWith('=')) return formulaStr;

                    const expr = formulaStr.substring(1).trim().toUpperCase();

                    try {
                        // Function: SUMA or SUM
                        if (expr.startsWith('SUMA(') || expr.startsWith('SUM(')) {
                            const range = expr.substring(expr.indexOf('(') + 1, expr.lastIndexOf(')')).trim();
                            const values = getValuesFromRange(range, sheetCells);
                            return values.reduce((a, b) => a + (parseFloat(b) || 0), 0);
                        }

                        // Function: PROMEDIO or AVERAGE
                        if (expr.startsWith('PROMEDIO(') || expr.startsWith('AVERAGE(')) {
                            const range = expr.substring(expr.indexOf('(') + 1, expr.lastIndexOf(')')).trim();
                            const values = getValuesFromRange(range, sheetCells).map(v => parseFloat(v)).filter(v => !isNaN(v));
                            if (values.length === 0) return 0;
                            return values.reduce((a, b) => a + b, 0) / values.length;
                        }

                        // Function: CONTAR or COUNT
                        if (expr.startsWith('CONTAR(') || expr.startsWith('COUNT(')) {
                            const range = expr.substring(expr.indexOf('(') + 1, expr.lastIndexOf(')')).trim();
                            const values = getValuesFromRange(range, sheetCells);
                            return values.filter(v => v !== '' && v !== null && !isNaN(parseFloat(v))).length;
                        }

                        // Function: MIN
                        if (expr.startsWith('MIN(')) {
                            const range = expr.substring(expr.indexOf('(') + 1, expr.lastIndexOf(')')).trim();
                            const values = getValuesFromRange(range, sheetCells).map(v => parseFloat(v)).filter(v => !isNaN(v));
                            return values.length > 0 ? Math.min(...values) : 0;
                        }

                        // Function: MAX
                        if (expr.startsWith('MAX(')) {
                            const range = expr.substring(expr.indexOf('(') + 1, expr.lastIndexOf(')')).trim();
                            const values = getValuesFromRange(range, sheetCells).map(v => parseFloat(v)).filter(v => !isNaN(v));
                            return values.length > 0 ? Math.max(...values) : 0;
                        }

                        // Function: SI or IF -> =SI(condition, valTrue, valFalse)
                        if (expr.startsWith('SI(') || expr.startsWith('IF(')) {
                            const paramsStr = expr.substring(expr.indexOf('(') + 1, expr.lastIndexOf(')'));
                            const parts = paramsStr.split(',').map(p => p.trim());
                            if (parts.length >= 3) {
                                const condEval = evaluateFormula('=' + parts[0], sheetCells);
                                if (condEval && condEval !== '#ERROR!') {
                                    return parts[1].replace(/^"|"$/g, '');
                                } else {
                                    return parts[2].replace(/^"|"$/g, '');
                                }
                            }
                        }

                        // General Cell References replacement & basic arithmetic computation
                        let sanitizedExpr = expr.replace(/([A-Z]+)(\d+)/g, (match, colStr, rowStr) => {
                            const cellKey = `${colStr}${rowStr}`;
                            const cell = sheetCells[cellKey];
                            if (!cell) return 0;
                            const val = cell.raw.startsWith('=') ? evaluateFormula(cell.raw, sheetCells) : cell.raw;
                            const num = parseFloat(val);
                            return isNaN(num) ? `"${val}"` : num;
                        });

                        // Safe mathematical expression evaluation
                        // Replace excel power ^ with JS **
                        sanitizedExpr = sanitizedExpr.replace(/\^/g, '**');

                        // Check for division by zero
                        if (/\/0(?!\d)/.test(sanitizedExpr)) {
                            return '#DIV/0!';
                        }

                        // Evaluate standard math safely
                        const result = Function(`"use strict"; return (${sanitizedExpr})`)();
                        if (typeof result === 'number') {
                            return Number.isInteger(result) ? result : parseFloat(result.toFixed(4));
                        }
                        return result;

                    } catch (err) {
                        return '#ERROR!';
                    }
                }

                // Helper to extract values list from range e.g. "A1:A5" or single cell "A1"
                function getValuesFromRange(rangeStr, sheetCells) {
                    const values = [];
                    if (rangeStr.includes(':')) {
                        const [startRef, endRef] = rangeStr.split(':').map(parseCellRef);
                        if (startRef && endRef) {
                            const minRow = Math.min(startRef.row, endRef.row);
                            const maxRow = Math.max(startRef.row, endRef.row);
                            const minCol = Math.min(startRef.col, endRef.col);
                            const maxCol = Math.max(startRef.col, endRef.col);

                            for (let r = minRow; r <= maxRow; r++) {
                                for (let c = minCol; c <= maxCol; c++) {
                                    const key = `${colToName(c)}${r}`;
                                    const cell = sheetCells[key];
                                    if (cell) {
                                        const val = cell.raw.startsWith('=') ? evaluateFormula(cell.raw, sheetCells) : cell.raw;
                                        values.push(val);
                                    } else {
                                        values.push('');
                                    }
                                }
                            }
                        }
                    } else {
                        const parsed = parseCellRef(rangeStr);
                        if (parsed) {
                            const key = `${colToName(parsed.col)}${parsed.row}`;
                            const cell = sheetCells[key];
                            if (cell) {
                                const val = cell.raw.startsWith('=') ? evaluateFormula(cell.raw, sheetCells) : cell.raw;
                                values.push(val);
                            }
                        }
                    }
                    return values;
                }

                /* ==========================================================================
                4. SPREADSHEET RENDERER & INTERACTION ENGINE
                ========================================================================== */

                function getActiveSheet() {
                    if (!state2.currentWorkbook || !state2.currentWorkbook.sheets) return null;
                    return state2.currentWorkbook.sheets[state2.activeSheetIndex];
                }

                function renderGrid() {
                    const sheet = getActiveSheet();
                    if (!sheet) return;

                    const tableHeader = document.getElementById('grid-header-col');
                    const tableBody = document.getElementById('grid-body');
                    const showGridlines = document.getElementById('toggle-gridlines').checked;

                    tableHeader.innerHTML = '';
                    tableBody.innerHTML = '';

                    const numCols = sheet.cols || DEFAULT_COLS;
                    const numRows = sheet.rows || DEFAULT_ROWS;

                    // Header Row (Top Left corner + Column Letters A..Z)
                    let headerRowHTML = `<tr><th class="excel-cell-header top-left-corner"></th>`;
                    for (let c = 1; c <= numCols; c++) {
                        const colName = colToName(c);
                        headerRowHTML += `<th class="excel-cell-header col-header" data-col="${c}">${colName}</th>`;
                    }
                    headerRowHTML += `</tr>`;
                    tableHeader.innerHTML = headerRowHTML;

                    // Grid Rows
                    let bodyHTML = '';
                    for (let r = 1; r <= numRows; r++) {
                        let rowHTML = `<tr><td class="excel-cell-header row-header" data-row="${r}">${r}</td>`;
                        for (let c = 1; c <= numCols; c++) {
                            const cellKey = `${colToName(c)}${r}`;
                            const cellData = sheet.cells[cellKey] || { raw: '', style: {} };
                            
                            // Evaluate value
                            let displayVal = cellData.raw;
                            if (cellData.raw && cellData.raw.startsWith('=')) {
                                displayVal = evaluateFormula(cellData.raw, sheet.cells);
                            }

                            // Format Value
                            displayVal = formatValueByStyle(displayVal, cellData.style?.numFmt);

                            // CSS Styles
                            let cellStyle = ``;
                            if (cellData.style?.bold) cellStyle += `font-weight: bold;`;
                            if (cellData.style?.italic) cellStyle += `font-style: italic;`;
                            if (cellData.style?.underline) cellStyle += `text-decoration: underline;`;
                            if (cellData.style?.strike) cellStyle += `text-decoration: line-through;`;
                            if (cellData.style?.align) cellStyle += `text-align: ${cellData.style.align};`;
                            if (cellData.style?.bgColor) cellStyle += `background-color: ${cellData.style.bgColor};`;
                            if (cellData.style?.textColor) cellStyle += `color: ${cellData.style.textColor};`;
                            if (!showGridlines) cellStyle += `border-color: transparent;`;

                            const isSelected = state2.selectedCell.row === r && state2.selectedCell.col === c;
                            const selectedClass = isSelected ? 'selected' : '';

                            rowHTML += `<td class="excel-cell ${selectedClass}" 
                                            id="cell-${r}-${c}"
                                            data-row="${r}" 
                                            data-col="${c}" 
                                            style="${cellStyle}"
                                            onclick="selectCell(${r}, ${c})" 
                                            ondblclick="startEditingCell(${r}, ${c})">
                                            ${displayVal !== undefined && displayVal !== null ? displayVal : ''}
                                        </td>`;
                        }
                        rowHTML += `</tr>`;
                        bodyHTML += rowHTML;
                    }
                    tableBody.innerHTML = bodyHTML;

                    updateFormulaBar();
                    updateStatsBar();
                    renderSheetTabs();
                }

                // Format cell values
                function formatValueByStyle(val, numFmt) {
                    if (val === '' || val === null || val === undefined) return '';
                    if (typeof val === 'string' && val.startsWith('#')) return val; // Error badges
                    
                    const num = parseFloat(val);
                    if (isNaN(num)) return val;

                    switch (numFmt) {
                        case 'number':
                            return num.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                        case 'currency':
                            return '$' + num.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                        case 'percentage':
                            return (num * 100).toFixed(1) + '%';
                        default:
                            return val;
                    }
                }

                // Cell Selection Handler
                function selectCell(row, col) {
                    if (state2.editingCell) {
                        stopEditingCell(true);
                    }

                    // Remove selected class from previous
                    const prevCell = document.getElementById(`cell-${state2.selectedCell.row}-${state2.selectedCell.col}`);
                    if (prevCell) prevCell.classList.remove('selected');

                    state2.selectedCell = { row, col };
                    const nextCell = document.getElementById(`cell-${row}-${col}`);
                    if (nextCell) nextCell.classList.add('selected');

                    updateFormulaBar();
                    updateStatsBar();
                }

                // Double Click / F2 Cell Edit
                function startEditingCell(row, col) {
                    const cellEl = document.getElementById(`cell-${row}-${col}`);
                    if (!cellEl) return;

                    const sheet = getActiveSheet();
                    const cellKey = `${colToName(col)}${row}`;
                    const cellData = sheet.cells[cellKey] || { raw: '' };

                    state2.editingCell = { row, col };
                    cellEl.classList.add('editing');
                    
                    const rawVal = cellData.raw || '';
                    cellEl.innerHTML = `<input type="text" id="active-cell-input" value="${rawVal.replace(/"/g, '&quot;')}" class="w-full h-full bg-transparent border-0 outline-none p-0 font-mono text-xs">`;
                    
                    const inputEl = document.getElementById('active-cell-input');
                    inputEl.focus();
                    inputEl.select();

                    inputEl.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter') {
                            saveCellInput(row, col, this.value);
                            selectCell(row + 1, col);
                        } else if (e.key === 'Tab') {
                            e.preventDefault();
                            saveCellInput(row, col, this.value);
                            selectCell(row, col + 1);
                        } else if (e.key === 'Escape') {
                            renderGrid();
                        }
                    });
                }

                function saveCellInput(row, col, value) {
                    pushUndoState();
                    const sheet = getActiveSheet();
                    const cellKey = `${colToName(col)}${row}`;
                    
                    if (!sheet.cells[cellKey]) {
                        sheet.cells[cellKey] = { raw: '', style: {} };
                    }
                    
                    sheet.cells[cellKey].raw = value;
                    state2.editingCell = null;
                    renderGrid();
                    triggerAutoSave();
                }

                function stopEditingCell(save = true) {
                    if (!state2.editingCell) return;
                    const inputEl = document.getElementById('active-cell-input');
                    if (inputEl && save) {
                        saveCellInput(state2.editingCell.row, state2.editingCell.col, inputEl.value);
                    } else {
                        state2.editingCell = null;
                        renderGrid();
                    }
                }

                // Formula Bar interactions
                function updateFormulaBar() {
                    const addressEl = document.getElementById('cell-address-indicator');
                    const formulaInput = document.getElementById('formula-bar-input');
                    
                    const cellKey = `${colToName(state2.selectedCell.col)}${state2.selectedCell.row}`;
                    addressEl.innerText = cellKey;

                    const sheet = getActiveSheet();
                    if (sheet && sheet.cells[cellKey]) {
                        formulaInput.value = sheet.cells[cellKey].raw || '';
                    } else {
                        formulaInput.value = '';
                    }
                }

                function handleFormulaBarInput(val) {
                    const sheet = getActiveSheet();
                    const cellKey = `${colToName(state2.selectedCell.col)}${state2.selectedCell.row}`;
                    if (!sheet.cells[cellKey]) {
                        sheet.cells[cellKey] = { raw: '', style: {} };
                    }
                    sheet.cells[cellKey].raw = val;
                }

                function handleFormulaBarKeyDown(e) {
                    if (e.key === 'Enter') {
                        saveCellInput(state2.selectedCell.row, state2.selectedCell.col, e.target.value);
                        selectCell(state2.selectedCell.row + 1, state2.selectedCell.col);
                    }
                }

                // Quick calculation stats at footer
                function updateStatsBar() {
                    const sheet = getActiveSheet();
                    if (!sheet) return;

                    const cellKey = `${colToName(state2.selectedCell.col)}${state2.selectedCell.row}`;
                    const cell = sheet.cells[cellKey];
                    let val = cell ? (cell.raw.startsWith('=') ? evaluateFormula(cell.raw, sheet.cells) : cell.raw) : 0;
                    const num = parseFloat(val);

                    if (!isNaN(num)) {
                        document.getElementById('stat-sum').innerText = num.toLocaleString();
                        document.getElementById('stat-avg').innerText = num.toLocaleString();
                        document.getElementById('stat-count').innerText = '1';
                    } else {
                        document.getElementById('stat-sum').innerText = '0';
                        document.getElementById('stat-avg').innerText = '0';
                        document.getElementById('stat-count').innerText = cell && cell.raw ? '1' : '0';
                    }
                }

                /* ==========================================================================
                5. FORMATTING & RIBBON ACTIONS
                ========================================================================== */
                
                function applyFormat(type, value = null) {
                    pushUndoState();
                    const sheet = getActiveSheet();
                    const cellKey = `${colToName(state2.selectedCell.col)}${state2.selectedCell.row}`;
                    
                    if (!sheet.cells[cellKey]) {
                        sheet.cells[cellKey] = { raw: '', style: {} };
                    }
                    if (!sheet.cells[cellKey].style) {
                        sheet.cells[cellKey].style = {};
                    }

                    const style = sheet.cells[cellKey].style;

                    switch (type) {
                        case 'bold':
                            style.bold = !style.bold;
                            break;
                        case 'italic':
                            style.italic = !style.italic;
                            break;
                        case 'underline':
                            style.underline = !style.underline;
                            break;
                        case 'strike':
                            style.strike = !style.strike;
                            break;
                        case 'align':
                            style.align = value;
                            break;
                        case 'bgColor':
                            style.bgColor = value;
                            break;
                        case 'textColor':
                            style.textColor = value;
                            break;
                        case 'numFmt':
                            style.numFmt = value;
                            break;
                    }

                    renderGrid();
                    triggerAutoSave();
                }

                /* ==========================================================================
                7. IMPORT & EXPORT SYSTEM (SheetJS XLSX)
                ========================================================================== */

                function handleFileImport(event) {
                    const file = event.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = function(e) {
                        try {
                            const data = new Uint8Array(e.target.result);
                            const workbook = XLSX.read(data, { type: 'array' });

                            if (!workbook.SheetNames || workbook.SheetNames.length === 0) {
                                throw new Error('El archivo no contiene hojas válidas.');
                            }

                            const newWorkbook = {
                                title: file.name.replace(/\.[^/.]+$/, ""),
                                createdAt: new Date().toISOString(),
                                updatedAt: new Date().toISOString(),
                                sheets: []
                            };

                            workbook.SheetNames.forEach(sheetName => {
                                const worksheet = workbook.Sheets[sheetName];
                                const range = XLSX.utils.decode_range(worksheet['!ref'] || 'A1:Z100');
                                
                                const sheetCells = {};
                                for (let R = range.s.r; R <= range.e.r; ++R) {
                                    for (let C = range.s.c; C <= range.e.c; ++C) {
                                        const cellAddress = XLSX.utils.encode_cell({ c: C, r: R });
                                        const cell = worksheet[cellAddress];
                                        if (cell && cell.v !== undefined) {
                                            sheetCells[cellAddress] = {
                                                raw: cell.f ? '=' + cell.f : String(cell.v),
                                                style: {}
                                            };
                                        }
                                    }
                                }

                                newWorkbook.sheets.push({
                                    id: Date.now() + Math.random(),
                                    name: sheetName,
                                    rows: Math.max(DEFAULT_ROWS, range.e.r + 1),
                                    cols: Math.max(DEFAULT_COLS, range.e.c + 1),
                                    cells: sheetCells
                                });
                            });

                            state2.currentWorkbook = newWorkbook;
                            state2.activeSheetIndex = 0;
                            saveCurrentWorkbook(true);
                            switchView('editor');
                            showToast('Importación Exitosa', `Archivo "${file.name}" cargado correctamente.`, 'success');

                        } catch (err) {
                            showToast('Error de Importación', 'No se pudo leer el archivo Excel: ' + err.message, 'error');
                        }
                    };

                    reader.readAsArrayBuffer(file);
                }

                function exportToXLSX() {
                    if (!state2.currentWorkbook) return;

                    try {
                        const wb = XLSX.utils.book_new();

                        state2.currentWorkbook.sheets.forEach(sheet => {
                            const aoa = [];
                            const maxRow = sheet.rows || DEFAULT_ROWS;
                            const maxCol = sheet.cols || DEFAULT_COLS;

                            for (let r = 1; r <= maxRow; r++) {
                                const rowData = [];
                                for (let c = 1; c <= maxCol; c++) {
                                    const cellKey = `${colToName(c)}${r}`;
                                    const cell = sheet.cells[cellKey];
                                    if (cell) {
                                        const val = cell.raw.startsWith('=') ? evaluateFormula(cell.raw, sheet.cells) : cell.raw;
                                        rowData.push(val);
                                    } else {
                                        rowData.push('');
                                    }
                                }
                                aoa.push(rowData);
                            }

                            const ws = XLSX.utils.aoa_to_sheet(aoa);
                            XLSX.utils.book_append_sheet(wb, ws, sheet.name);
                        });

                        XLSX.writeFile(wb, `${state2.currentWorkbook.title || 'ExcelStudio'}.xlsx`);
                        showToast('Exportación completada', 'Archivo descargado en formato .xlsx', 'success');
                    } catch (err) {
                        showToast('Error al exportar', err.message, 'error');
                    }
                }

                function exportToCSV() {
                    const sheet = getActiveSheet();
                    if (!sheet) return;

                    let csvContent = "";
                    const maxRow = sheet.rows || DEFAULT_ROWS;
                    const maxCol = sheet.cols || DEFAULT_COLS;

                    for (let r = 1; r <= maxRow; r++) {
                        const rowVals = [];
                        for (let c = 1; c <= maxCol; c++) {
                            const cellKey = `${colToName(c)}${r}`;
                            const cell = sheet.cells[cellKey];
                            let val = cell ? (cell.raw.startsWith('=') ? evaluateFormula(cell.raw, sheet.cells) : cell.raw) : '';
                            rowVals.push(`"${String(val).replace(/"/g, '""')}"`);
                        }
                        csvContent += rowVals.join(",") + "\n";
                    }

                    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                    const link = document.createElement("a");
                    const url = URL.createObjectURL(blob);
                    link.setAttribute("href", url);
                    link.setAttribute("download", `${sheet.name}.csv`);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    showToast('CSV Exportado', `Hoja ${sheet.name} guardada como CSV.`, 'success');
                }

                /* ==========================================================================

                async function saveCurrentWorkbook(manual = false) {
                    if (!state2.currentWorkbook) return;

                    state2.currentWorkbook.updatedAt = new Date().toISOString();
                    if (!state2.currentWorkbook.title) state2.currentWorkbook.title = 'Libro Sin Título';

                    try {
                        const id = await db_excel_2.workbooks.put(state2.currentWorkbook);
                        state2.currentWorkbook.id = id;

                        // Send to Web Worker for background validation
                        autoSaveWorker.postMessage({
                            type: 'PROCESS_AUTOSAVE',
                            payload: state2.currentWorkbook
                        });

                        if (manual) {
                            showToast('Guardado', `El libro "${state2.currentWorkbook.title}" se guardó correctamente.`, 'success');
                        }
                        updateDocTitleDisplay();
                        updateStorageEstimate();
                    } catch (err) {
                        showToast('Error al guardar', err.message, 'error');
                    }
                }

                function triggerAutoSave() {
                    const dotEl = document.getElementById('autosave-dot');
                    const textEl = document.getElementById('autosave-text');
                    if (dotEl) dotEl.classList.remove('bg-emerald-400');
                    if (textEl) textEl.innerText = 'Guardando...';
                    saveCurrentWorkbook(false);
                }

                async function renderRecentWorkbooks() {
                    const listEl = document.getElementById('recent-workbooks-list');
                    if (!listEl) return;

                    const searchQuery = (document.getElementById('dashboard-search')?.value || '').toLowerCase();
                    const allWorkbooks = await db_excel_2.workbooks.orderBy('updatedAt').reverse().toArray();

                    const filtered = allWorkbooks.filter(wb => wb.title.toLowerCase().includes(searchQuery));

                    if (filtered.length === 0) {
                        listEl.innerHTML = `
                            <div class="col-span-full py-8 text-center text-slate-400 text-xs">
                                <i data-lucide="folder-open" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>
                                <p>No hay libros guardados actualmente.</p>
                            </div>
                        `;
                        lucide.createIcons();
                        return;
                    }

                    listEl.innerHTML = filtered.map(wb => `
                        <div class="bg-slate-50 border border-slate-200 hover:border-excel-500 rounded-xl p-4 flex flex-col justify-between transition shadow-2xs hover:shadow-sm">
                            <div>
                                <div class="flex items-start justify-between">
                                    <h4 class="font-bold text-slate-800 text-sm truncate max-w-[180px]">${wb.title}</h4>
                                    <span class="text-[10px] bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full font-mono">${wb.sheets.length} hoja(s)</span>
                                </div>
                                <p class="text-[11px] text-slate-400 mt-1">Modificado: ${new Date(wb.updatedAt).toLocaleString()}</p>
                            </div>

                            <div class="flex items-center justify-between border-t border-slate-200/60 pt-3 mt-4">
                                <button onclick="openWorkbook(${wb.id})" class="text-xs bg-excel-700 hover:bg-excel-800 text-white font-semibold px-3 py-1.5 rounded-lg transition flex items-center space-x-1">
                                    <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                                    <span>Abrir</span>
                                </button>
                                
                                <div class="flex items-center space-x-1">
                                    <button onclick="duplicateWorkbook(${wb.id})" title="Duplicar" class="p-1.5 text-slate-500 hover:bg-slate-200 rounded-md">
                                        <i data-lucide="copy" class="w-4 h-4"></i>
                                    </button>
                                    <button onclick="deleteWorkbook(${wb.id})" title="Eliminar" class="p-1.5 text-red-500 hover:bg-red-50 rounded-md">
                                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            </div>
