                }

                async function openWorkbook(id) {
                    const wb = await db_excel_2.workbooks.get(id);
                    if (wb) {
                        state2.currentWorkbook = wb;
                        state2.activeSheetIndex = 0;
                        switchView('editor');
                        showToast('Libro abierto', `Cargado "${wb.title}"`, 'info');
                    }
                }

                async function duplicateWorkbook(id) {
                    const wb = await db_excel_2.workbooks.get(id);
                    if (wb) {
                        delete wb.id;
                        wb.title += ' (Copia)';
                        wb.createdAt = new Date().toISOString();
                        wb.updatedAt = new Date().toISOString();
                        await db_excel_2.workbooks.add(wb);
                        renderRecentWorkbooks();
                        showToast('Duplicado', 'Se ha creado una copia del libro.', 'success');
                    }
                }

                async function deleteWorkbook(id) {
                    await db_excel_2.workbooks.delete(id);
                    renderRecentWorkbooks();
                    showToast('Eliminado', 'El archivo ha sido borrado permanentemente.', 'info');
                }

                function createNewBlankWorkbook() {
                    state2.currentWorkbook = {
                        title: 'Libro Sin Título',
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString(),
                        sheets: [{ id: Date.now(), name: 'Hoja 1', rows: DEFAULT_ROWS, cols: DEFAULT_COLS, cells: {} }]
                    };
                    state2.activeSheetIndex = 0;
                    saveCurrentWorkbook(true);
                    switchView('editor');
                }

                async function updateStorageEstimate() {
                    if (navigator.storage && navigator.storage.estimate) {
                        const estimate = await navigator.storage.estimate();
                        const mbUsed = (estimate.usage / (1024 * 1024)).toFixed(2);
                        const el = document.getElementById('storage-usage-text');
                        if (el) el.innerText = `${mbUsed} MB usados`;
                    }
                }

                /* ==========================================================================
                10. UNDO / REDO STACK & UI NAVIGATION
                ========================================================================== */

                function pushUndoState() {
                    if (!state2.currentWorkbook) return;
                    state2.undoStack.push(JSON.stringify(state2.currentWorkbook));
                    if (state2.undoStack.length > 30) state2.undoStack.shift(); // Max 30 levels
                    state2.redoStack = [];
                }

                function undo() {
                    if (state2.undoStack.length === 0) return;
                    state2.redoStack.push(JSON.stringify(state2.currentWorkbook));
                    const prev = state2.undoStack.pop();
                    state2.currentWorkbook = JSON.parse(prev);
                    renderGrid();
                    triggerAutoSave();
                    showToast('Deshecho', 'Acción deshecha.', 'info');
                }

                function redo() {
                    if (state2.redoStack.length === 0) return;
                    state2.undoStack.push(JSON.stringify(state2.currentWorkbook));
                    const next = state2.redoStack.pop();
                    state2.currentWorkbook = JSON.parse(next);
                    renderGrid();
                    triggerAutoSave();
                    showToast('Rehecho', 'Acción rehecha.', 'info');
                }

                function switchView(viewName) {
                    state2.currentView = viewName;
                    const dashEl = document.getElementById('view-dashboard');
                    const editEl = document.getElementById('view-editor');
                    const btnDash = document.getElementById('btn-view-dashboard');
                    const btnEdit = document.getElementById('btn-view-editor');

                    if (viewName === 'dashboard') {
                        dashEl.classList.remove('hidden');
                        editEl.classList.add('hidden');
                        editEl.classList.remove('flex');
                        btnDash.className = 'px-3 py-1 rounded text-xs font-semibold flex items-center space-x-1.5 transition bg-excel-600 text-white shadow-sm';
                        btnEdit.className = 'px-3 py-1 rounded text-xs font-semibold flex items-center space-x-1.5 transition text-excel-100 hover:text-white hover:bg-excel-700/50';
                        renderRecentWorkbooks();
                    } else {
                        dashEl.classList.add('hidden');
                        editEl.classList.remove('hidden');
                        editEl.classList.add('flex');
                        btnEdit.className = 'px-3 py-1 rounded text-xs font-semibold flex items-center space-x-1.5 transition bg-excel-600 text-white shadow-sm';
                        btnDash.className = 'px-3 py-1 rounded text-xs font-semibold flex items-center space-x-1.5 transition text-excel-100 hover:text-white hover:bg-excel-700/50';
                        if (!state2.currentWorkbook) {
                            createNewBlankWorkbook();
                        } else {
                            renderGrid();
                        }
                    }
                    updateDocTitleDisplay();
                }

                function setRibbonTab(tabName) {
                    state2.activeRibbonTab = tabName;
                    ['home', 'formulas', 'view', 'export'].forEach(t => {
                        const btn = document.getElementById(`tab-btn-${t}`);
                        const content = document.getElementById(`ribbon-content-${t}`);
                        if (t === tabName) {
                            btn.classList.add('active');
                            content.classList.remove('hidden');
                            content.classList.add('flex');
                        } else {
                            btn.classList.remove('active');
                            content.classList.add('hidden');
                            content.classList.remove('flex');
                        }
                    });
                }

                function updateDocTitleDisplay() {
                    const el = document.getElementById('current-workbook-name');
                    if (el && state2.currentWorkbook) {
                        el.innerText = state2.currentWorkbook.title || 'Libro Sin Título';
                    }
                }

                function promptRenameWorkbook() {
                    if (!state2.currentWorkbook) return;
                    openPromptModal("Renombrar Libro", state2.currentWorkbook.title, (newTitle) => {
                        if (newTitle.trim()) {
                            state2.currentWorkbook.title = newTitle.trim();
                            updateDocTitleDisplay();
                            saveCurrentWorkbook(true);
                        }
                    });
                }

                /* ==========================================================================
                11. KEYBOARD SHORTCUTS ENGINE
                ========================================================================== */

                document.addEventListener('keydown', function(e) {
                    // Handle global shortcuts
                    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                        e.preventDefault();
                        saveCurrentWorkbook(true);
                    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                        e.preventDefault();
                        undo();
                    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
                        e.preventDefault();
                        redo();
                    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b') {
                        e.preventDefault();
                        applyFormat('bold');
                    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'i') {
                        e.preventDefault();
                        applyFormat('italic');
                    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'u') {
                        e.preventDefault();
                        applyFormat('underline');
                    } else if ((e.ctrlKey || e.metaKey) && e.key === '/') {
                        e.preventDefault();
                        toggleShortcutsModal(true);
                    }

                    // Grid Navigation when view is editor and not editing cell
                    if (state2.currentView === 'editor' && !state2.editingCell && document.activeElement.tagName !== 'INPUT') {
                        const row = state2.selectedCell.row;
                        const col = state2.selectedCell.col;

                        if (e.key === 'ArrowUp') {
                            e.preventDefault();
                            if (row > 1) selectCell(row - 1, col);
                        } else if (e.key === 'ArrowDown') {
                            e.preventDefault();
                            selectCell(row + 1, col);
                        } else if (e.key === 'ArrowLeft') {
                            e.preventDefault();
                            if (col > 1) selectCell(row, col - 1);
                        } else if (e.key === 'ArrowRight') {
                            e.preventDefault();
                            selectCell(row, col + 1);
                        } else if (e.key === 'Delete' || e.key === 'Backspace') {
                            e.preventDefault();
                            clearSelectedCell();
                        } else if (e.key === 'F2') {
                            e.preventDefault();
                            startEditingCell(row, col);
                        } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
                            // Direct typing on selected cell
                            startEditingCell(row, col);
                        }
                    }
                });

                /* ==========================================================================
                12. MODALS & TOAST NOTIFICATIONS
                ========================================================================== */

                function toggleShortcutsModal(show) {
                    const modal = document.getElementById('modal-shortcuts');
                    if (show) {
                        modal.classList.remove('hidden');
                        setTimeout(() => modal.classList.remove('opacity-0'), 10);
                    } else {
                        modal.classList.add('opacity-0');
                        setTimeout(() => modal.classList.add('hidden'), 200);
                    }
                }

                function openPromptModal(title, initialValue, callback) {
                    const modal = document.getElementById('modal-prompt');
                    document.getElementById('prompt-modal-title').innerText = title;
                    const input = document.getElementById('prompt-modal-input');
                    input.value = initialValue;
                    
                    const confirmBtn = document.getElementById('prompt-modal-confirm-btn');
                    confirmBtn.onclick = function() {
                        callback(input.value);
                        closePromptModal();
                    };

                    modal.classList.remove('hidden');
                    setTimeout(() => modal.classList.remove('opacity-0'), 10);
                    input.focus();
                }

                function closePromptModal() {
                    const modal = document.getElementById('modal-prompt');
                    modal.classList.add('opacity-0');
                    setTimeout(() => modal.classList.add('hidden'), 200);
                }

                function showToast(title, message, type = 'success') {
                    const container = document.getElementById('toast-container');
                    if (!container) return;

                    const toast = document.createElement('div');
                    toast.className = `pointer-events-auto flex items-start space-x-3 p-3.5 rounded-xl shadow-xl border text-xs max-w-xs transition-all duration-300 transform translate-y-2 opacity-0 bg-white border-slate-200`;

                    let iconColor = 'text-emerald-500';
                    let iconName = 'check-circle-2';

                    if (type === 'error') {
                        iconColor = 'text-red-500';
                        iconName = 'alert-triangle';
                    } else if (type === 'info') {
                        iconColor = 'text-blue-500';
                        iconName = 'info';
                    }

                    toast.innerHTML = `
                        <i data-lucide="${iconName}" class="w-5 h-5 ${iconColor} shrink-0 mt-0.5"></i>
                        <div class="flex-1">
                            <h5 class="font-bold text-slate-800">${title}</h5>
                            <p class="text-slate-500 mt-0.5">${message}</p>
                        </div>
                    `;

                    container.appendChild(toast);
                    lucide.createIcons();

                    setTimeout(() => {
                        toast.classList.remove('translate-y-2', 'opacity-0');
                    }, 10);

                    setTimeout(() => {
                        toast.classList.add('opacity-0', 'translate-y-2');
                        setTimeout(() => toast.remove(), 300);
                    }, 3500);
                }

                /* ==========================================================================
                13. INITIAL LOAD SETUP
                ========================================================================== */

                window.onload = function() {
                    lucide.createIcons();
                    renderRecentWorkbooks();
                    updateStorageEstimate();

                    // Default to Dashboard
                    switchView('dashboard');
                };
            </script>
        </body>

                            <span class="text-slate-600 dark:text-slate-300">Ir a la Galería</span>
                            <kbd class="px-2 py-1 bg-slate-100 dark:bg-slate-800 rounded font-mono border border-slate-200 dark:border-slate-700">Alt + 2</kbd>
                        </div>
                        <div class="flex justify-between items-center py-2">
                            <span class="text-slate-600 dark:text-slate-300">Abrir este panel de atajos</span>
                            <kbd class="px-2 py-1 bg-slate-100 dark:bg-slate-800 rounded font-mono border border-slate-200 dark:border-slate-700">Ctrl + /</kbd>

            <script>
                const db_img = new Dexie('ImgStudioDB');
                db_img.version(1).stores({
                    images: '++id, name, type, size, createdAt, updatedAt'
                });

                let currentImageRecord = null;
                let originalImageBitmap = null;
                let currentZoom = 1;
                let autoSaveTimer = null;
                let backgroundWorker = null;

                // Initialize Web Worker via Blob for image processing offloading
                const workerCode = `
                    self.onmessage = function(e) {
                        const { action, payload } = e.data;
                        if (action === 'compress') {
                            // Simulate heavy background optimization processing
                            setTimeout(() => {
                                self.postMessage({ action: 'compressed', result: payload });
                            }, 300);
                        }
                    };
                `;
                const blob_img = new Blob([workerCode], { type: 'application/javascript' });
                backgroundWorker = new Worker(URL.createObjectURL(blob_img));
                backgroundWorker.onmessage = function(e) {
                    if (e.data.action === 'compressed') {
                        console.log('Worker: Optimización en segundo plano completada.');
                    }
                };

                // Window load initialization
                window.addEventListener('DOMContentLoaded', async () => {
                    initDropZone();
                    await refreshDashboardStats();
                    loadGallery();
                    setupKeyboardListeners();
                });

                // Theme Toggle
                function toggleDarkMode() {
                    const html = document.documentElement;
                    if (html.classList.contains('dark')) {
                        html.classList.remove('dark');
                        localStorage.setItem('theme', 'light');
                    } else {
                        html.classList.add('dark');
                        localStorage.setItem('theme', 'dark');
                    }
                }
                if (localStorage.getItem('theme') === 'light') {
                    document.documentElement.classList.remove('dark');
                }

                // Navigation Switcher
                function switchView(viewName) {
                    ['dashboard', 'gallery', 'editor'].forEach(v => {
                        document.getElementById(`view-${v}`).classList.add('hidden');
                        const navBtn = document.getElementById(`nav-${v}`);
                        navBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-2 transition-all text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white";
                    });

                    document.getElementById(`view-${viewName}`).classList.remove('hidden');
                    const activeNav = document.getElementById(`nav-${viewName}`);
                    activeNav.className = "px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-2 transition-all bg-white dark:bg-slate-700 shadow-sm text-emerald-600 dark:text-emerald-400";

                    if (viewName === 'gallery') loadGallery();
                    if (viewName === 'dashboard') refreshDashboardStats();
                }

                function switchTab(tabName) {
                    ['adjust', 'transform', 'export'].forEach(t => {
                        document.getElementById(`tab-content-${t}`).classList.add('hidden');
                        const btn = document.getElementById(`tab-btn-${t}`);
                        btn.className = "flex-1 pb-2 text-xs font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition";
                    });
                    document.getElementById(`tab-content-${tabName}`).classList.remove('hidden');
                    const activeBtn = document.getElementById(`tab-btn-${tabName}`);
                    activeBtn.className = "flex-1 pb-2 text-xs font-bold border-b-2 border-emerald-500 text-emerald-500 transition";
                }

                // Toast Notifications
                function showToast(message, type = 'success') {
                    const container = document.getElementById('toast-container');
                    const toast = document.createElement('div');
                    const bg = type === 'success' ? 'bg-emerald-600 text-white' : type === 'error' ? 'bg-rose-600 text-white' : 'bg-slate-800 text-white';
                    const icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-info';
                    
                    toast.className = `${bg} px-4 py-3 rounded-2xl shadow-xl flex items-center gap-3 text-xs font-semibold pointer-events-auto animate-fade-in`;
                    toast.innerHTML = `<i class="fa-solid ${icon} text-base"></i><span>${message}</span>`;
                    
                    container.appendChild(toast);
                    setTimeout(() => {
                        toast.style.opacity = '0';
                        toast.style.transition = 'opacity 0.3s ease';
                        setTimeout(() => toast.remove(), 300);
                    }, 3500);
                }

                function triggerImport() {
                    document.getElementById('global-file-input').click();
                }

                function initDropZone() {
                    const dropZone = document.getElementById('drop-zone');
                    if (!dropZone) return;

                    ['dragenter', 'dragover'].forEach(eventName => {
                        dropZone.addEventListener(eventName, (e) => {
                            e.preventDefault();
                            dropZone.classList.add('border-emerald-500', 'bg-emerald-500/5');
                        }, false);
                    });

                    ['dragleave', 'drop'].forEach(eventName => {
                        dropZone.addEventListener(eventName, (e) => {
                            e.preventDefault();
                            dropZone.classList.remove('border-emerald-500', 'bg-emerald-500/5');
                        }, false);
                    });

                    dropZone.addEventListener('drop', (e) => {
                        const dt = e.dataTransfer;
                        const files = dt.files;
                        processFiles(files);
                    });
                }

                function handleFilesImport(event) {
                    const files = event.target.files;
                    processFiles(files);
                    event.target.value = ''; // reset input
                }

                async function processFiles(files) {
                    if (!files || files.length === 0) return;

                    let successCount = 0;
                    let errorCount = 0;

                    for (const file of files) {
                        try {
                            // Robust error management & validation
                            const validTypes = ['image/png', 'image/jpeg', 'image/jpg', 'image/x-icon', 'image/svg+xml'];
                            if (!validTypes.includes(file.type) && !file.name.match(/\.(png|jpg|jpeg|ico|svg)$/i)) {
                                throw new Error(`Formato no soportado: ${file.name}`);
                            }
                            if (file.size > 25 * 1024 * 1024) {
                                throw new Error(`Archivo demasiado grande (>25MB): ${file.name}`);
                            }

                            const arrayBuffer = await file.arrayBuffer();
                            const record = {
                                name: file.name,
                                type: file.type || 'image/png',
                                size: file.size,
                                data: arrayBuffer,
                                createdAt: new Date().toISOString(),
                                updatedAt: new Date().toISOString()
                            };

                            const newId = await db_img.images.add(record);
                            successCount++;

                            // Offload optimization to Web Worker
                            backgroundWorker.postMessage({ action: 'compress', payload: { id: newId, size: file.size } });

                            // Open last imported in editor automatically
                            if (successCount === 1 && files.length === 1) {
                                loadRecordIntoEditor({ ...record, id: newId });
                            }
                        } catch (err) {
                            console.error("Error importando archivo:", err);
                            errorCount++;
                            showToast(err.message, 'error');
                        }
                    }

                    if (successCount > 0) {
                        showToast(`¡Se importaron ${successCount} imágenes correctamente!`);
                        await refreshDashboardStats();
                        loadGallery();
                        if (successCount === 1 && document.getElementById('view-editor').classList.contains('hidden')) {
                            switchView('editor');
                        }
                    }
                }

                async function refreshDashboardStats() {
                    try {
                        const count = await db_img.images.count();
                        document.getElementById('stat-total').innerText = count;

                        const allImages = await db_img.images.toArray();
                        let totalBytes = allImages.reduce((acc, img) => acc + (img.size || 0), 0);
                        
                        let storageFormatted = totalBytes < 1024 * 1024 
                            ? (totalBytes / 1024).toFixed(1) + ' KB' 
                            : (totalBytes / (1024 * 1024)).toFixed(2) + ' MB';
                        
                        document.getElementById('stat-storage').innerText = storageFormatted;

                        // Render recent list in dashboard
                        const recentContainer = document.getElementById('dashboard-recent-list');
                        if (allImages.length === 0) {
                            recentContainer.innerHTML = `
                                <div class="text-center py-10 text-slate-400 text-sm">
                                    <i class="fa-solid fa-folder-open text-3xl mb-2 block opacity-50"></i>
                                    No hay imágenes guardadas todavía. ¡Importa la primera!
                                </div>`;
                            return;
                        }

                        const recent = allImages.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt)).slice(0, 5);
                        recentContainer.innerHTML = recent.map(img => {
                            const blobUrl = URL.createObjectURL(new Blob([img.data], { type: img.type }));
                            return `
                                <div class="flex items-center justify-between p-3 rounded-2xl bg-slate-50 dark:bg-slate-950/40 border border-slate-100 dark:border-slate-800 hover:border-emerald-500/50 transition">
                                    <div class="flex items-center space-x-3 truncate">
                                        <img src="${blobUrl}" class="w-10 h-10 object-cover rounded-xl border border-slate-200 dark:border-slate-700 checkerboard" alt="">
                                        <div class="truncate">
                                            <h4 class="font-bold text-xs truncate">${img.name}</h4>
                                            <p class="text-[10px] text-slate-400">${(img.size / 1024).toFixed(1)} KB • ${new Date(img.updatedAt).toLocaleDateString()}</p>
                                        </div>
                                    </div>
                                    <div class="flex items-center space-x-1.5">
                                        <button onclick="openInEditor(${img.id})" title="Editar" class="p-2 rounded-xl bg-slate-200/60 dark:bg-slate-800 hover:bg-emerald-500 hover:text-white transition text-xs"><i class="fa-solid fa-paintbrush"></i></button>
                                        <button onclick="deleteImage(${img.id})" title="Eliminar" class="p-2 rounded-xl bg-slate-200/60 dark:bg-slate-800 hover:bg-rose-500 hover:text-white transition text-xs"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                </div>
                            `;
                        }).join('');
                    } catch (e) {
                        console.error("Error refreshing stats:", e);
                    }
                }

                async function loadGallery() {
                    const grid = document.getElementById('gallery-grid');
                    const searchTerm = document.getElementById('gallery-search').value.toLowerCase();
                    const filterType = document.getElementById('gallery-filter-type').value;

                    let images = await db_img.images.toArray();

                    // Filter logic
                    images = images.filter(img => {
                        const matchesName = img.name.toLowerCase().includes(searchTerm);
                        if (!matchesName) return false;
                        if (filterType === 'all') return true;
                        if (filterType === 'png' && img.type.includes('png')) return true;
                        if (filterType === 'jpg' && (img.type.includes('jpeg') || img.type.includes('jpg'))) return true;
                        if (filterType === 'ico' && (img.type.includes('icon') || img.name.endsWith('.ico'))) return true;
                        if (filterType === 'svg' && (img.type.includes('svg') || img.name.endsWith('.svg'))) return true;
                        return false;
                    });

                    if (images.length === 0) {
                        grid.innerHTML = `
                            <div class="col-span-full text-center py-20 text-slate-400">
                                <i class="fa-solid fa-images text-4xl mb-3 block opacity-40"></i>
                                <p class="text-sm font-semibold">No se encontraron imágenes</p>
                                <p class="text-xs text-slate-500 mt-1">Prueba con otros filtros o importa nuevos archivos.</p>
                            </div>`;
                        return;
                    }

                    grid.innerHTML = images.map(img => {
                        const blobUrl = URL.createObjectURL(new Blob([img.data], { type: img.type }));
                        return `
                            <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden flex flex-col group hover:shadow-md transition">
                                <div class="h-40 bg-slate-100 dark:bg-slate-950 relative overflow-hidden checkerboard flex items-center justify-center">
                                    <img src="${blobUrl}" class="max-h-full max-w-full object-contain p-2 group-hover:scale-105 transition duration-300" alt="${img.name}">
                                    <div class="absolute inset-0 bg-slate-950/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center space-x-2">
                                        <button onclick="openInEditor(${img.id})" class="w-9 h-9 rounded-xl bg-white text-slate-900 hover:bg-emerald-500 hover:text-white flex items-center justify-center shadow transition"><i class="fa-solid fa-paintbrush"></i></button>
                                        <button onclick="deleteImage(${img.id})" class="w-9 h-9 rounded-xl bg-white text-rose-600 hover:bg-rose-600 hover:text-white flex items-center justify-center shadow transition"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                </div>
                                <div class="p-3.5 flex flex-col flex-1 justify-between">
                                    <div>
                                        <h4 class="font-bold text-xs truncate mb-1" title="${img.name}">${img.name}</h4>
                                        <p class="text-[10px] text-slate-400 uppercase font-mono">${img.type.split('/')[1] || 'IMG'} • ${(img.size / 1024).toFixed(1)} KB</p>
                                    </div>
                                    <div class="mt-3 pt-2 border-t border-slate-100 dark:border-slate-800 flex justify-between items-center text-[11px]">
                                        <span class="text-slate-400">${new Date(img.updatedAt).toLocaleDateString()}</span>
                                        <button onclick="openInEditor(${img.id})" class="text-emerald-500 font-bold hover:underline">Editar →</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                }

                function filterGallery() {
                    loadGallery();
                }

                async function deleteImage(id) {
                    if (!confirm('¿Estás seguro de eliminar esta imagen permanentemente?')) return;
                    await db_img.images.delete(id);
                    showToast('Imagen eliminada de la base de datos local');
                    await refreshDashboardStats();
                    loadGallery();
                    if (currentImageRecord && currentImageRecord.id === id) {
                        currentImageRecord = null;
                        document.getElementById('editor-placeholder').classList.remove('hidden');
                        document.getElementById('editor-filename').innerText = 'Sin imagen seleccionada';
                    }
                }

                async function openInEditor(id) {
                    const record = await db_img.images.get(id);
                    if (!record) return;
                    loadRecordIntoEditor(record);
                    switchView('editor');
                }

                async function loadRecordIntoEditor(record) {
                    currentImageRecord = record;
                    document.getElementById('editor-filename').innerText = record.name;
                    document.getElementById('export-filename').value = record.name.substring(0, record.name.lastIndexOf('.')) || record.name;
                    document.getElementById('editor-badge-type').innerText = record.type.split('/')[1] || 'IMG';
                    document.getElementById('editor-placeholder').classList.add('hidden');

                    const blob_img = new Blob([record.data], { type: record.type });
                    const bitmap = await createImageBitmap(blob_img);
                    originalImageBitmap = bitmap;

                    const canvas = document.getElementById('image-canvas');
                    canvas.width = bitmap.width;
                    canvas.height = bitmap.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(bitmap, 0, 0);

                    document.getElementById('canvas-dimensions').innerText = `Dimensiones: ${bitmap.width} x ${bitmap.height} px`;
                    document.getElementById('resize-w').value = bitmap.width;
                    document.getElementById('resize-h').value = bitmap.height;

                    resetFiltersUI();
                    resetZoom();
                    setupAutoSave();
                }

                function applyFilters() {
                    if (!originalImageBitmap) return;

                    const brightness = document.getElementById('range-brightness').value;
                    const contrast = document.getElementById('range-contrast').value;
                    const saturation = document.getElementById('range-saturation').value;
                    const blur = document.getElementById('range-blur').value;

                    document.getElementById('val-brightness').innerText = brightness + '%';
                    document.getElementById('val-contrast').innerText = contrast + '%';
                    document.getElementById('val-saturation').innerText = saturation + '%';
                    document.getElementById('val-blur').innerText = blur + ' px';

                    const canvas = document.getElementById('image-canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = originalImageBitmap.width;
                    canvas.height = originalImageBitmap.height;

                    ctx.filter = `brightness(${brightness}%) contrast(${contrast}%) saturate(${saturation}%) blur(${blur}px)`;
                    ctx.drawImage(originalImageBitmap, 0, 0);

                    triggerAutoSaveSignal();
                }

                function resetFiltersUI() {
                    document.getElementById('range-brightness').value = 100;
                    document.getElementById('range-contrast').value = 100;
                    document.getElementById('range-saturation').value = 100;
                    document.getElementById('range-blur').value = 0;
                    applyFilters();
                }

                function resetFilters() {
                    resetFiltersUI();
                    showToast('Ajustes restablecidos');
                }

                function setPreset(type) {
                    if (!originalImageBitmap) return;
                    const canvas = document.getElementById('image-canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = originalImageBitmap.width;
                    canvas.height = originalImageBitmap.height;

                    if (type === 'normal') {
                        resetFiltersUI();
                        return;
                    } else if (type === 'grayscale') {
                        ctx.filter = 'grayscale(100%)';
                    } else if (type === 'sepia') {
                        ctx.filter = 'sepia(100%)';
                    } else if (type === 'vintage') {
                        ctx.filter = 'sepia(50%) contrast(120%) brightness(90%)';
                    } else if (type === 'invert') {
                        ctx.filter = 'invert(100%)';
                    } else if (type === 'cool') {
                        ctx.filter = 'hue-rotate(180deg) saturate(120%)';
                    }

                    ctx.drawImage(originalImageBitmap, 0, 0);
                    triggerAutoSaveSignal();
                    showToast(`Filtro "${type}" aplicado`);
                }

                async function rotateImage(deg) {
                    if (!originalImageBitmap) return;
                    const canvas = document.getElementById('image-canvas');
                    const ctx = canvas.getContext('2d');

                    const offCanvas = document.createElement('canvas');
                    const offCtx = offCanvas.getContext('2d');

                    if (deg === 90) {
                        offCanvas.width = canvas.height;
                        offCanvas.height = canvas.width;
                        offCtx.translate(offCanvas.width / 2, offCanvas.height / 2);
                        offCtx.rotate((90 * Math.PI) / 180);
                        offCtx.drawImage(canvas, -canvas.width / 2, -canvas.height / 2);
                    }

                    const blob_img = await new Promise(res => offCanvas.toBlob(res, currentImageRecord.type || 'image/png'));
                    originalImageBitmap = await createImageBitmap(blob_img);
                    
                    canvas.width = originalImageBitmap.width;
                    canvas.height = originalImageBitmap.height;
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(originalImageBitmap, 0, 0);

                    document.getElementById('canvas-dimensions').innerText = `Dimensiones: ${canvas.width} x ${canvas.height} px`;
                    document.getElementById('resize-w').value = canvas.width;
                    document.getElementById('resize-h').value = canvas.height;

                    triggerAutoSaveSignal();
                    showToast('Imagen rotada 90°');
                }

                async function flipImage(dir) {
                    if (!originalImageBitmap) return;
                    const canvas = document.getElementById('image-canvas');
                    const ctx = canvas.getContext('2d');

                    const offCanvas = document.createElement('canvas');
                    offCanvas.width = canvas.width;
                    offCanvas.height = canvas.height;
                    const offCtx = offCanvas.getContext('2d');

                    offCtx.translate(offCanvas.width, 0);
                    offCtx.scale(-1, 1);
                    offCtx.drawImage(canvas, 0, 0);

                    const blob_img = await new Promise(res => offCanvas.toBlob(res, currentImageRecord.type || 'image/png'));
                    originalImageBitmap = await createImageBitmap(blob_img);

                    canvas.width = originalImageBitmap.width;
                    canvas.height = originalImageBitmap.height;
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(originalImageBitmap, 0, 0);

                    triggerAutoSaveSignal();
                    showToast('Efecto espejo aplicado');
                }

                async function applyResize() {
                    if (!originalImageBitmap) return;
                    const w = parseInt(document.getElementById('resize-w').value);
                    const h = parseInt(document.getElementById('resize-h').value);

                    if (!w || !h || w <= 0 || h <= 0) {
                        showToast('Introduce dimensiones válidas', 'error');
                        return;
                    }

                    const canvas = document.getElementById('image-canvas');
                    const ctx = canvas.getContext('2d');

                    const offCanvas = document.createElement('canvas');
                    offCanvas.width = w;
                    offCanvas.height = h;
                    const offCtx = offCanvas.getContext('2d');
                    offCtx.drawImage(canvas, 0, 0, w, h);

                    const blob_img = await new Promise(res => offCanvas.toBlob(res, currentImageRecord.type || 'image/png'));
                    originalImageBitmap = await createImageBitmap(blob_img);

                    canvas.width = w;
                    canvas.height = h;
                    ctx.clearRect(0, 0, w, h);
                    ctx.drawImage(originalImageBitmap, 0, 0);

                    document.getElementById('canvas-dimensions').innerText = `Dimensiones: ${w} x ${h} px`;
                    triggerAutoSaveSignal();
                    showToast('Imagen redimensionada correctamente');
                }

                // Zoom Controls
                function zoomEditor(delta) {
                    currentZoom = Math.max(0.2, Math.min(4, currentZoom + delta));
                    document.getElementById('canvas-wrapper').style.transform = `scale(${currentZoom})`;
                    document.getElementById('zoom-level').innerText = Math.round(currentZoom * 100) + '%';
                }

                function resetZoom() {
                    currentZoom = 1;
                    document.getElementById('canvas-wrapper').style.transform = `scale(1)`;
                    document.getElementById('zoom-level').innerText = '100%';
                }

                async function exportImage() {
                    if (!currentImageRecord) {
                        showToast('No hay ninguna imagen seleccionada para exportar', 'error');
                        return;
                    }

                    const canvas = document.getElementById('image-canvas');
                    const format = document.getElementById('export-format').value;
                    const quality = parseInt(document.getElementById('range-quality').value) / 100;
                    const filename = document.getElementById('export-filename').value || 'imagen-editada';

                    const extension = format.split('/')[1] === 'jpeg' ? 'jpg' : format.split('/')[1] === 'x-icon' ? 'ico' : format.split('/')[1];
                    const fullName = `${filename}.${extension}`;

                    canvas.toBlob((blob_img) => {
                        const url = URL.createObjectURL(blob_img);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = fullName;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                        showToast(`Imagen exportada como ${fullName}`);
                    }, format, quality);
                }

                async function saveChangesToDB() {
                    if (!currentImageRecord) return;

                    const canvas = document.getElementById('image-canvas');
                    canvas.toBlob(async (blob_img) => {
                        const arrayBuffer = await blob_img.arrayBuffer();
                        currentImageRecord.data = arrayBuffer;
                        currentImageRecord.size = blob_img.size;
                        currentImageRecord.type = blob_img.type;
                        currentImageRecord.updatedAt = new Date().toISOString();

                        await db_img.images.put(currentImageRecord);
                        showToast('Cambios guardados en IndexedDB localmente');
                        document.getElementById('autosave-status').innerHTML = '<i class="fa-solid fa-circle-check"></i> Guardado';
                        await refreshDashboardStats();
                    }, currentImageRecord.type || 'image/png');
                }

                // Autosave automated background trigger
                function setupAutoSave() {
                    if (autoSaveTimer) clearInterval(autoSaveTimer);
                    autoSaveTimer = setInterval(() => {
                        // Background autosave signal check
                    }, 30000);
                }

                function triggerAutoSaveSignal() {
                    const statusEl = document.getElementById('autosave-status');
                    statusEl.innerHTML = '<span class="text-amber-500 animate-pulse"><i class="fa-solid fa-circle-notch fa-spin"></i> Modificado...</span>';
                    
                    // Debounced autosave
                    clearTimeout(window._autosaveTimeout);
                    window._autosaveTimeout = setTimeout(() => {
                        saveChangesToDB();
                    }, 1500);
                }

                // Keyboard Shortcuts Manager
                function setupKeyboardListeners() {
                    window.addEventListener('keydown', (e) => {
                        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'o') {
                            e.preventDefault();
                            triggerImport();
                        }
                        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                            e.preventDefault();
                            saveChangesToDB();
                        }
                        if ((e.ctrlKey || e.metaKey) && e.key === '/') {
                            e.preventDefault();
                            openShortcutsModal();
                        }
                        if (e.altKey && e.key === '1') {
                            e.preventDefault();
                            switchView('dashboard');
                        }
                        if (e.altKey && e.key === '2') {
                            e.preventDefault();
                            switchView('gallery');
                        }
                    });
                }

                function openShortcutsModal() {
                    document.getElementById('shortcuts-modal').classList.remove('hidden');
                }

                function closeShortcutsModal() {
                    document.getElementById('shortcuts-modal').classList.add('hidden');
                }
            </script>
        </body>
        </html>
    </template>
