            <!-- TOAST NOTIFICATION CONTAINER -->
            <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>
    
            <script>
                /**
                 * Word Studio Application Core Logic
                 * Uses Dexie.js for IndexedDB storage, Mammoth.js for Word imports, and a Web Worker for autosave.
                 */

                // 1. Initialize Dexie Database
                const db_word = new Dexie("WordStudioDB");
                db_word.version(1).stores({
                    documents: 'id, title, createdAt, updatedAt, wordCount'
                });

                // Current Editing State
                let activeDocumentId = null;
                let isDirty = false;
                let autoSaveTimer_word = null;
                let bgWorker = null;

                // Templates Database Content
                const TEMPLATES = {
                    blanco: {
                        title: "Documento sin título",
                        content: "<h1>Título del Documento</h1><p>Empieza a escribir aquí tu nuevo documento...</p>"
                    },
                    cv: {
                        title: "Currículum Vitae - Profesional",
                        content: "<h1>Juan Pérez</h1><p><strong>Desarrollador de Software | Especialista Web</strong></p><hr><p><strong>Correo:</strong> juan.perez@email.com | <strong>Teléfono:</strong> +34 600 000 000</p><h2>Experiencia Profesional</h2><h3>Desarrollador Senior - Empresa Tech (2021 - Presente)</h3><ul><li>Liderazgo en desarrollo de soluciones avanzadas.</li><li>Optimización de bases de datos y rendimiento local.</li></ul><h2>Educación</h2><p><strong>Grado en Ingeniería Informática</strong> - Universidad Nacional (2016 - 2020)</p>"
                    },
                    reporte: {
                        title: "Informe Ejecutivo Q3",
                        content: "<h1>Informe de Rendimiento Trimestral</h1><p><em>Fecha: Octubre 2026</em></p><h2>1. Resumen Ejecutivo</h2><p>Durante el último trimestre se han alcanzado los objetivos clave en un 95% de eficiencia...</p><h2>2. Métricas Clave</h2><table><thead><tr><th>Métrica</th><th>Anterior</th><th>Actual</th></tr></thead><tbody><tr><td>Usuarios Activos</td><td>10,000</td><td>15,400</td></tr><tr><td>Retención</td><td>82%</td><td>89%</td></tr></tbody></table>"
                    },
                    carta: {
                        title: "Carta Formal de Presentación",
                        content: "<p>Madrid, 4 de Octubre de 2026</p><br><p><strong>Estimado/a Director/a de Recursos Humanos,</strong></p><p>Me dirijo a usted con el fin de expresar mi firme interés en formar parte de su organización...</p><p>Agradeciendo de antemano su tiempo y consideración, quedo a su entera disposición.</p><br><p>Atentamente,</p><p><strong>Tu Nombre</strong></p>"
                    },
                    propuesta: {
                        title: "Propuesta Comercial de Proyecto",
                        content: "<h1>Propuesta de Desarrollo de Software</h1><h2>Alcance del Proyecto</h2><p>Desarrollo integral de plataforma web responsiva con capacidad de trabajo offline e IndexedDB.</p><h2>Fases y Entregables</h2><ul><li>Fase 1: Diseño de Arquitectura y UI</li><li>Fase 2: Implementación de Módulos</li><li>Fase 3: Pruebas y Despliegue</li></ul>"
                    }
                };

                /**
                 * Initialize Inline Web Worker for Background Operations
                 */
                function initWebWorker() {
                    try {
                        const workerCode = `
                        self.onmessage = function(e) {
                            const { action, doc } = e.data;
                            if (action === 'processContent') {
                                // Calculate word count & analytics in background worker thread
                                const text = doc.content.replace(/<[^>]*>/g, ' ');
                                const words = text.trim().split(/\\s+/).filter(w => w.length > 0).length;
                                const chars = text.length;
                                self.postMessage({
                                    action: 'contentProcessed',
                                    docId: doc.id,
                                    wordCount: words,
                                    charCount: chars
                                });
                            }
                        };
                    `;
                        const blob = new Blob([workerCode], { type: 'application/javascript' });
                        bgWorker = new Worker(URL.createObjectURL(blob));

                        bgWorker.onmessage = function (e) {
                            if (e.data.action === 'contentProcessed') {
                                // Background update stats without blocking UI main thread
                                updateLiveCountersUI(e.data.wordCount, e.data.charCount);
                            }
                        };
                    } catch (err) {
                        console.warn("Web Worker initialization fallback:", err);
                    }
                }

                // Application Startup Handler
                window.addEventListener('DOMContentLoaded', async () => {
                    initWebWorker();
                    await loadDashboardStats();
                    await renderDocumentsList();

                    // Auto-load last opened doc or blank document
                    const docs = await db_word.documents.orderBy('updatedAt').reverse().toArray();
                    if (docs.length > 0) {
                        await openDocument(docs[0].id);
                    } else {
                        await createNewDocument('blanco');
                    }

                    // Register Keyboard Shortcuts
                    setupKeyboardShortcuts();
                });

                // Switch Screen Views (Dashboard vs Editor)
                function switchView(viewName) {
                    const dashboardView = document.getElementById('dashboard-view');
                    const editorView = document.getElementById('editor-view');
                    const navDashboard = document.getElementById('nav-dashboard-btn');
                    const navEditor = document.getElementById('nav-editor-btn');

                    if (viewName === 'dashboard') {
                        dashboardView.classList.remove('hidden');
                        editorView.classList.add('hidden');
                        editorView.classList.remove('flex');

                        navDashboard.className = "flex items-center space-x-2 px-4 py-1.5 rounded-md text-sm font-medium transition-all bg-white dark:bg-slate-800 text-brand-600 dark:text-brand-400 shadow-sm";
                        navEditor.className = "flex items-center space-x-2 px-4 py-1.5 rounded-md text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition-all";

                        loadDashboardStats();
                        renderDocumentsList();
                    } else {
                        dashboardView.classList.add('hidden');
                        editorView.classList.remove('hidden');
                        editorView.classList.add('flex');

                        navEditor.className = "flex items-center space-x-2 px-4 py-1.5 rounded-md text-sm font-medium transition-all bg-white dark:bg-slate-800 text-brand-600 dark:text-brand-400 shadow-sm";
                        navDashboard.className = "flex items-center space-x-2 px-4 py-1.5 rounded-md text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition-all";
                    }
                }

                /**
                 * Create New Document
                 */
                async function createNewDocument(templateKey = 'blanco') {
                    const template = TEMPLATES[templateKey] || TEMPLATES.blanco;
                    const newDoc = {
                        id: 'doc_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                        title: template.title,
                        content: template.content,
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString(),
                        wordCount: 0
                    };

                    try {
                        await db_word.documents.add(newDoc);
                        showToast("Documento creado con éxito", "success");
                        await openDocument(newDoc.id);
                        switchView('editor');
                    } catch (err) {
                        console.error("Error creating document:", err);
                        showToast("Error al crear el documento", "error");
                    }
                }

                /**
                 * Open Document by ID
                 */
                async function openDocument(id) {
                    try {
                        const doc = await db_word.documents.get(id);
                        if (!doc) return;

                        activeDocumentId = doc.id;
                        document.getElementById('current-doc-title').value = doc.title;
                        document.getElementById('editor-canvas').innerHTML = doc.content;

                        triggerContentAnalysis();
                        updateSaveIndicator("Guardado");
                        switchView('editor');
                    } catch (err) {
                        console.error("Error opening document:", err);
                        showToast("Error al abrir el documento", "error");
                    }
                }

                /**
                 * Save Current Active Document
                 */
                async function saveCurrentDocument() {
                    if (!activeDocumentId) return;

                    updateSaveIndicator("Guardando...");
                    const title = document.getElementById('current-doc-title').value.trim() || "Documento sin título";
                    const content = document.getElementById('editor-canvas').innerHTML;
                    const textContent = document.getElementById('editor-canvas').innerText || "";
                    const wordCount = textContent.trim().split(/\s+/).filter(w => w.length > 0).length;

                    try {
                        await db_word.documents.update(activeDocumentId, {
                            title: title,
                            content: content,
                            wordCount: wordCount,
                            updatedAt: new Date().toISOString()
                        });

                        isDirty = false;
                        updateSaveIndicator("Guardado");
                        showToast("Documento guardado en IndexedDB", "success");
                    } catch (err) {
                        console.error("Error saving document:", err);
                        updateSaveIndicator("Error al guardar");
                        showToast("Error en persistencia de datos", "error");
                    }
                }

                /**
                 * Handle Word (.docx) File Upload & Mammoth parsing
                 */
                function handleFileInput(event) {
                    const file = event.target.files[0];
                    if (file) {
                        processDocxFile(file);
                    }
                    event.target.value = ''; // Reset input
                }

                function handleDragOver(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    document.getElementById('drop-zone').classList.add('border-brand-500', 'bg-brand-50/50');
                }

                function handleDragLeave(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    document.getElementById('drop-zone').classList.remove('border-brand-500', 'bg-brand-50/50');
                }

                function handleDrop(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    document.getElementById('drop-zone').classList.remove('border-brand-500', 'bg-brand-50/50');

                    const files = e.dataTransfer.files;
                    if (files && files.length > 0) {
                        const file = files[0];
                        if (file.name.endsWith('.docx')) {
                            processDocxFile(file);
                        } else {
                            showToast("Por favor, selecciona un archivo válido con formato .docx", "error");
                        }
                    }
                }

                /**
                 * Core Mammoth DOCX Parser with Error Handling
                 */
                function processDocxFile(file) {
                    showToast("Procesando archivo Word...", "info");

                    const reader = new FileReader();
                    reader.onload = function (loadEvent) {
                        const arrayBuffer = loadEvent.target.result;

                        mammoth.convertToHtml({ arrayBuffer: arrayBuffer })
                            .then(function (result) {
                                const html = result.value;
                                const warnings = result.warnings;

                                if (warnings && warnings.length > 0) {
                                    console.warn("Mammoth import warnings:", warnings);
                                }

                                // Create Imported Document Record
                                const fileName = file.name.replace(/\.[^/.]+$/, "");
                                const newDoc = {
                                    id: 'doc_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                                    title: fileName,
                                    content: html || "<p>Documento importado vacío.</p>",
                                    createdAt: new Date().toISOString(),
                                    updatedAt: new Date().toISOString(),
                                    wordCount: 0
                                };

                                db_word.documents.add(newDoc).then(() => {
                                    showToast(`"${fileName}" importado exitosamente`, "success");
                                    openDocument(newDoc.id);
                                });
                            })
                            .catch(function (error) {
                                console.error("Mammoth DOCX parsing failed:", error);
                                showToast("Error al leer el archivo Word. Asegúrate de que sea un archivo .docx válido.", "error");
                            });
                    };

                    reader.onerror = function (err) {
                        console.error("FileReader error:", err);
                        showToast("Error de lectura de archivo local", "error");
                    };

                    reader.readAsArrayBuffer(file);
                }

                /**
                 * Render Documents Grid in Dashboard
                 */
                async function renderDocumentsList() {
                    const grid = document.getElementById('documents-grid');
                    const searchQuery = (document.getElementById('doc-search-input').value || "").toLowerCase();

                    let docs = await db_word.documents.orderBy('updatedAt').reverse().toArray();

                    if (searchQuery) {
                        docs = docs.filter(d => d.title.toLowerCase().includes(searchQuery));
                    }

                    if (docs.length === 0) {
                        grid.innerHTML = `
                        <div class="col-span-full text-center py-12 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700">
                            <i class="fa-solid fa-folder-open text-4xl text-slate-300 dark:text-slate-600 mb-3"></i>
                            <p class="text-sm font-semibold text-slate-600 dark:text-slate-400">No se encontraron documentos</p>
                            <p class="text-xs text-slate-400 dark:text-slate-500 mt-1">Crea un documento nuevo o importa un archivo Word para empezar.</p>
                        </div>
                    `;
                        return;
                    }

                    grid.innerHTML = docs.map(doc => {
                        const dateFormatted = new Date(doc.updatedAt).toLocaleDateString('es-ES', {
                            day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
                        });

                        return `
                        <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-4 shadow-sm hover:shadow-md transition flex flex-col justify-between space-y-3 group">
                            <div class="flex items-start justify-between">
                                <div class="flex items-center space-x-3 min-w-0">
                                    <div class="w-9 h-9 rounded-lg bg-brand-50 dark:bg-brand-900/30 text-brand-600 dark:text-brand-400 flex items-center justify-center shrink-0">
                                        <i class="fa-solid fa-file-word"></i>
                                    </div>
                                    <div class="min-w-0">
                                        <h4 class="text-sm font-bold text-slate-900 dark:text-white truncate cursor-pointer hover:text-brand-600" onclick="openDocument('${doc.id}')">${escapeHtml(doc.title)}</h4>
                                        <p class="text-[11px] text-slate-400">${dateFormatted}</p>
                                    </div>
                                </div>
                            </div>
    
                            <div class="flex items-center justify-between pt-2 border-t border-slate-100 dark:border-slate-700/50 text-xs text-slate-500 dark:text-slate-400">
                                <span><i class="fa-solid fa-font text-slate-400 mr-1"></i> ${doc.wordCount || 0} palabras</span>
                                <div class="flex items-center space-x-1 opacity-90 group-hover:opacity-100">
                                    <button onclick="openDocument('${doc.id}')" title="Editar" class="p-1.5 hover:bg-brand-50 dark:hover:bg-brand-900/30 text-brand-600 rounded">
                                        <i class="fa-solid fa-pen-to-square"></i>
                                    </button>
                                    <button onclick="duplicateDocument('${doc.id}')" title="Duplicar" class="p-1.5 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 rounded">
                                        <i class="fa-solid fa-copy"></i>
                                    </button>
                                    <button onclick="deleteDocument('${doc.id}')" title="Eliminar" class="p-1.5 hover:bg-rose-50 dark:hover:bg-rose-900/30 text-rose-600 rounded">
                                        <i class="fa-solid fa-trash-can"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    }).join('');
                }

                /**
                 * Update Global Metrics in Dashboard
                 */
                async function loadDashboardStats() {
                    const docs = await db_word.documents.toArray();
                    document.getElementById('stat-total-docs').innerText = docs.length;

                    const totalWords = docs.reduce((acc, d) => acc + (d.wordCount || 0), 0);
                    document.getElementById('stat-total-words').innerText = totalWords.toLocaleString();
                }

                /**
                 * Duplicate Document
                 */
                async function duplicateDocument(id) {
                    const doc = await db_word.documents.get(id);
                    if (!doc) return;

                    const newDoc = {
                        ...doc,
                        id: 'doc_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                        title: doc.title + " (Copia)",
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString()
                    };

                    await db_word.documents.add(newDoc);
                    showToast("Documento duplicado", "success");
                    renderDocumentsList();
                    loadDashboardStats();
                }

                /**
                 * Delete Single Document
                 */
                async function deleteDocument(id) {
                    if (confirm("¿Estás seguro de que deseas eliminar este documento?")) {
                        await db_word.documents.delete(id);
                        showToast("Documento eliminado", "info");
                        if (activeDocumentId === id) {
                            activeDocumentId = null;
                        }
                        renderDocumentsList();
                        loadDashboardStats();
                    }
                }

                /**
                 * Delete All Documents
                 */
                async function confirmDeleteAll() {
                    if (confirm("ATENCIÓN: ¿Seguro que deseas borrar TODOS los documentos almacenados localmente?")) {
                        await db_word.documents.clear();
                        showToast("Todos los documentos han sido borrados", "info");
                        renderDocumentsList();
                        loadDashboardStats();
                    }
                }

                /**
                 * Rich Text Editing Executive Commands
                 */
                function execCommand(command, value = null) {
                    document.execCommand(command, false, value);
                    handleEditorInput();
                }

                function insertLink() {
                    const url = prompt("Introduce la URL del enlace:", "https://");
                    if (url) {
                        document.execCommand('createLink', false, url);
                    }
                }

                function promptInsertImage() {
                    const url = prompt("Introduce la URL de la imagen:", "https://images.unsplash.com/photo-1542435503-956c469947f6?auto=format&fit=crop&w=600&q=80");
                    if (url) {
                        document.execCommand('insertImage', false, url);
                    }
                }

                function insertTable() {
                    const tableHtml = `
                    <table class="w-full my-4 border-collapse border border-slate-300">
                        <thead>
                            <tr class="bg-slate-100">
                                <th class="border border-slate-300 p-2">Encabezado 1</th>
                                <th class="border border-slate-300 p-2">Encabezado 2</th>
                                <th class="border border-slate-300 p-2">Encabezado 3</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="border border-slate-300 p-2">Dato 1</td>
                                <td class="border border-slate-300 p-2">Dato 2</td>
                                <td class="border border-slate-300 p-2">Dato 3</td>
                            </tr>
                            <tr>
                                <td class="border border-slate-300 p-2">Dato 4</td>
                                <td class="border border-slate-300 p-2">Dato 5</td>
                                <td class="border border-slate-300 p-2">Dato 6</td>
                            </tr>
                        </tbody>
                    </table>
                `;
                    document.execCommand('insertHTML', false, tableHtml);
                }

                /**
                 * Real-time Content Analysis and Debounced Autosave
                 */
                function handleEditorInput() {
                    isDirty = true;
                    updateSaveIndicator("Modificado...");

                    triggerContentAnalysis();

                    // Debounced Background Auto-save (1.5 seconds delay)
                    clearTimeout(autoSaveTimer_word);
                    autoSaveTimer_word = setTimeout(() => {
                        saveCurrentDocument();
                    }, 1500);
                }

                function triggerContentAnalysis() {
                    const content = document.getElementById('editor-canvas').innerHTML;
                    if (bgWorker && activeDocumentId) {
                        bgWorker.postMessage({
                            action: 'processContent',
                            doc: { id: activeDocumentId, content: content }
                        });
                    } else {
                        const text = document.getElementById('editor-canvas').innerText || "";
                        const words = text.trim().split(/\s+/).filter(w => w.length > 0).length;
                        updateLiveCountersUI(words, text.length);
                    }
                }

                function updateLiveCountersUI(words, chars) {
                    document.getElementById('live-word-count').innerText = words.toLocaleString();
                    document.getElementById('live-char-count').innerText = chars.toLocaleString();
                    const readTime = Math.max(1, Math.ceil(words / 200));
                    document.getElementById('live-read-time').innerText = readTime;
                }

                function updateDocumentTitle(newTitle) {
                    isDirty = true;
                    saveCurrentDocument();
                }

                function updateSaveIndicator(text) {
                    const ind = document.getElementById('save-status-indicator');
                    if (text === "Guardado") {
                        ind.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-500"></i> Guardado`;
                    } else if (text === "Guardando...") {
                        ind.innerHTML = `<i class="fa-solid fa-arrows-rotate animate-spin text-brand-500"></i> Guardando...`;
                    } else {
                        ind.innerHTML = `<i class="fa-solid fa-pen text-amber-500"></i> Sin guardar`;
                    }
                }

                /**
                 * Document Export Options
                 */
                function toggleExportMenu() {
                    const menu = document.getElementById('export-menu');
                    menu.classList.toggle('hidden');
                }

                // Close menu when clicking outside
                window.addEventListener('click', (e) => {
                    if (!e.target.closest('#export-dropdown-btn') && !e.target.closest('#export-menu')) {
                        document.getElementById('export-menu').classList.add('hidden');
                    }
                });

                function exportAsDOCX() {
                    const title = document.getElementById('current-doc-title').value.trim() || "documento";
                    const content = document.getElementById('editor-canvas').innerHTML;

                    const fullHtml = `
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <meta charset="utf-8">
                        <title>${title}</title>
                        <style>
                            body { font-family: Arial, sans-serif; font-size: 11pt; line-height: 1.5; }
                            h1 { font-size: 20pt; color: #111827; }
                            h2 { font-size: 16pt; color: #1f2937; }
                            table { border-collapse: collapse; width: 100%; }
                            table, th, td { border: 1px solid #9ca3af; padding: 6px; }
                        </style>
                    </head>
                    <body>
                        ${content}
                    </body>
                    </html>
                `;

                    try {
                        if (typeof htmlDocx !== 'undefined') {
                            const converted = htmlDocx.asBlob(fullHtml);
                            saveAs(converted, `${title}.docx`);
                            showToast("Exportado como .docx", "success");
                        } else {
                            // Fallback to word blob
                            const blob = new Blob(['\ufeff' + fullHtml], { type: 'application/msword' });
                            saveAs(blob, `${title}.doc`);
                            showToast("Exportado como documento de Word", "success");
                        }
                    } catch (err) {
                        console.error("Export DOCX failed:", err);
                        showToast("Error al exportar archivo DOCX", "error");
                    }
                }

                function exportAsHTML() {
                    const title = document.getElementById('current-doc-title').value.trim() || "documento";
                    const content = document.getElementById('editor-canvas').innerHTML;

                    const blob = new Blob([content], { type: 'text/html;charset=utf-8' });
                    saveAs(blob, `${title}.html`);
                    showToast("Exportado como .html", "success");
                }

                function exportAsTXT() {
                    const title = document.getElementById('current-doc-title').value.trim() || "documento";
                    const text = document.getElementById('editor-canvas').innerText || "";

                    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                    saveAs(blob, `${title}.txt`);
                    showToast("Exportado como .txt", "success");
                }

                /**
                 * Global Keyboard Shortcuts System
                 */
                function setupKeyboardShortcuts() {
                    window.addEventListener('keydown', (e) => {
                        // Ctrl + S (Save)
                        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                            e.preventDefault();
                            saveCurrentDocument();
                        }
                        // Ctrl + Alt + N (New document)
                        if ((e.ctrlKey || e.metaKey) && e.altKey && e.key.toLowerCase() === 'n') {
                            e.preventDefault();
                            createNewDocument('blanco');
                        }
                        // Alt + D (Switch to Dashboard)
                        if (e.altKey && e.key.toLowerCase() === 'd') {
                            e.preventDefault();
                            switchView('dashboard');
                        }
                        // Ctrl + K (Show Shortcuts Modal)
                        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                            e.preventDefault();
                            toggleShortcutsModal();
                        }
                    });
                }

                function toggleShortcutsModal() {
                    const modal = document.getElementById('shortcuts-modal');
                    modal.classList.toggle('hidden');
                }

                /**
                 * Toast Notification Manager
                 */
                function showToast(message, type = 'info') {
                    const container = document.getElementById('toast-container');
                    const toast = document.createElement('div');

                    let bgColors = "bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900";
                    let icon = "fa-circle-info text-blue-400";

                    if (type === 'success') {
                        bgColors = "bg-slate-900 text-white dark:bg-slate-800 dark:text-white border-l-4 border-emerald-500";
                        icon = "fa-circle-check text-emerald-400";
                    } else if (type === 'error') {
                        bgColors = "bg-slate-900 text-white dark:bg-slate-800 dark:text-white border-l-4 border-rose-500";
                        icon = "fa-circle-xmark text-rose-400";
                    }

                    toast.className = `pointer-events-auto flex items-center space-x-3 px-4 py-3 rounded-xl shadow-xl text-xs font-medium transition-all duration-300 transform translate-y-2 opacity-0 ${bgColors}`;
                    toast.innerHTML = `<i class="fa-solid ${icon} text-sm"></i><span>${escapeHtml(message)}</span>`;

                    container.appendChild(toast);

                    // Animate In
                    requestAnimationFrame(() => {
                        toast.classList.remove('translate-y-2', 'opacity-0');
                    });

                    // Animate Out & Remove
                    setTimeout(() => {
                        toast.classList.add('opacity-0', 'translate-y-2');
                        setTimeout(() => toast.remove(), 300);
                    }, 3500);
                }

                /**
                 * Theme Toggle Handler (Dark/Light Mode)
                 */
                function toggleTheme() {
                    const html = document.documentElement;
                    const themeIcon = document.getElementById('theme-icon');

                    if (html.classList.contains('dark')) {
                        html.classList.remove('dark');
                        themeIcon.className = "fa-solid fa-moon";
                    } else {
                        html.classList.add('dark');
                        themeIcon.className = "fa-solid fa-sun text-amber-400";
                    }
                }

                /**
                 * Utility: Escape HTML String
                 */
                function escapeHtml(str) {
                    return str.replace(/&/g, "&amp;")
                        .replace(/</g, "&lt;")
                        .replace(/>/g, "&gt;")
                        .replace(/"/g, "&quot;")
                        .replace(/'/g, "&#039;");
                }
            </script>

                    <!-- MODAL 2: RENAME SHEET / WORKBOOK -->
                    <div id="modal-prompt"
                        class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center z-50 hidden opacity-0 modal-fade">

                    <!-- TOAST NOTIFICATIONS CONTAINER -->
                    <div id="toast-container"
                        class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none">
                        <!-- Toasts injected dynamically -->
                    </div>
    
                    <script>
                        /* ==========================================================================
                           1. DATABASE INITIALIZATION (Dexie.js) & BACKGROUND WEB WORKER SETUP
                           ========================================================================== */

                        // Initialize IndexedDB Database using Dexie
                        const db_excel = new Dexie("ExcelStudioDB");
                        db_excel.version(1).stores({
                            workbooks: '++id, title, updatedAt, createdAt'
                        });

                        // Create Background Web Worker inline via Blob
                        const workerScript_test = `
                self.onmessage = function(e) {
                    const { type, payload } = e.data;
                    if (type === 'PROCESS_AUTOSAVE') {
                        // Perform background compression and validation checks
                        const jsonStr = JSON.stringify(payload);
                        const bytes = jsonStr.length;
                        const timestamp = new Date().toLocaleTimeString();
                        
                        // Respond back to main thread
                        self.postMessage({
                            type: 'AUTOSAVE_COMPLETE',
                            timestamp: timestamp,
                            bytesSaved: bytes,
                            workbookId: payload.id
                        });
                    }
                };
            `;
                         blob_test3 = new Blob([workerScript_test], { type: 'application/javascript' });
                        const autoSaveWorker = new Worker(URL.createObjectURL(blob_test3));

                        // Listen for worker messages
                        autoSaveWorker.onmessage = function (e) {
                            const { type, timestamp, bytesSaved } = e.data;
                            if (type === 'AUTOSAVE_COMPLETE') {
                                const textEl = document.getElementById('autosave-text');
                                const dotEl = document.getElementById('autosave-dot');
                                if (textEl) {
                                    textEl.innerText = `Guardado a las ${timestamp}`;
                                }
                                if (dotEl) {
                                    dotEl.classList.add('bg-emerald-400');
                                }
                            }
                        };

                        /* ==========================================================================
                           2. GLOBAL APPLICATION STATE
                           ========================================================================== */
                        let state4 = {
                            currentView: 'dashboard',
                            activeRibbonTab: 'home',
                            currentWorkbook: null, // Holds complete workbook object
                            activeSheetIndex: 0,
                            selectedCell: { row: 1, col: 1 },
                            editingCell: null,
                            zoomLevel: 1.0,
                            undoStack: [],
                            redoStack: []
                        };

                        // Default dimensions
                         DEFAULT_ROWS = 100;
                         DEFAULT_COLS = 26; // A to Z

                        /* ==========================================================================
                           3. FORMULA EVALUATOR ENGINE
                           ========================================================================== */

                        // Convert Column Index (1-based) to Name (1 -> A, 26 -> Z)
                        function colToName(col) {
                            let temp, letter = '';
                            while (col > 0) {
                                temp = (col - 1) % 26;
                                letter = String.fromCharCode(65 + temp) + letter;
                                col = (col - temp - 1) / 26;
                            }
                            return letter;
                        }

                        // Convert Name to Column Index (A -> 1, Z -> 26)
                        function nameToCol(name) {
                            let col = 0;
                            const str = name.toUpperCase();
                            for (let i = 0; i < str.length; i++) {
                                col = col * 26 + (str.charCodeAt(i) - 64);
                            }
                            return col;
                        }

                        // Parse Cell Reference string like "A1" into { row: 1, col: 1 }
                        function parseCellRef(ref) {
                            const match = ref.toUpperCase().match(/^([A-Z]+)(\d+)$/);
                            if (!match) return null;
                            return {
                                col: nameToCol(match[1]),
                                row: parseInt(match[2], 10)
                            };
                        }

                        // Evaluate formula string safely
                        function evaluateFormula(formulaStr, sheetCells) {
                            if (!formulaStr.startsWith('=')) return formulaStr;

                            const expr = formulaStr.substring(1).trim().toUpperCase();

                            try {
                                // Function: SUMA or SUM
                                if (expr.startsWith('SUMA(') || expr.startsWith('SUM(')) {
                                    const range = expr.substring(expr.indexOf('(') + 1, expr.lastIndexOf(')')).trim();
                                    const values = getValuesFromRange(range, sheetCells);
                                    return values.reduce((a, b) => a + (parseFloat(b) || 0), 0);
                                }

                                // Function: PROMEDIO or AVERAGE
                                if (expr.startsWith('PROMEDIO(') || expr.startsWith('AVERAGE(')) {
                                    const range = expr.substring(expr.indexOf('(') + 1, expr.lastIndexOf(')')).trim();
                                    const values = getValuesFromRange(range, sheetCells).map(v => parseFloat(v)).filter(v => !isNaN(v));
                                    if (values.length === 0) return 0;
                                    return values.reduce((a, b) => a + b, 0) / values.length;
                                }

                                // Function: CONTAR or COUNT
                                if (expr.startsWith('CONTAR(') || expr.startsWith('COUNT(')) {
                                    const range = expr.substring(expr.indexOf('(') + 1, expr.lastIndexOf(')')).trim();
                                    const values = getValuesFromRange(range, sheetCells);
                                    return values.filter(v => v !== '' && v !== null && !isNaN(parseFloat(v))).length;
                                }

                                // Function: MIN
                                if (expr.startsWith('MIN(')) {
                                    const range = expr.substring(expr.indexOf('(') + 1, expr.lastIndexOf(')')).trim();
                                    const values = getValuesFromRange(range, sheetCells).map(v => parseFloat(v)).filter(v => !isNaN(v));
                                    return values.length > 0 ? Math.min(...values) : 0;
                                }

                                // Function: MAX
                                if (expr.startsWith('MAX(')) {
                                    const range = expr.substring(expr.indexOf('(') + 1, expr.lastIndexOf(')')).trim();
                                    const values = getValuesFromRange(range, sheetCells).map(v => parseFloat(v)).filter(v => !isNaN(v));
                                    return values.length > 0 ? Math.max(...values) : 0;
                                }

                                // Function: SI or IF -> =SI(condition, valTrue, valFalse)
                                if (expr.startsWith('SI(') || expr.startsWith('IF(')) {
                                    const paramsStr = expr.substring(expr.indexOf('(') + 1, expr.lastIndexOf(')'));
                                    const parts = paramsStr.split(',').map(p => p.trim());
                                    if (parts.length >= 3) {
                                        const condEval = evaluateFormula('=' + parts[0], sheetCells);
                                        if (condEval && condEval !== '#ERROR!') {
                                            return parts[1].replace(/^"|"$/g, '');
                                        } else {
                                            return parts[2].replace(/^"|"$/g, '');
                                        }
                                    }
                                }

                                // General Cell References replacement & basic arithmetic computation
                                let sanitizedExpr = expr.replace(/([A-Z]+)(\d+)/g, (match, colStr, rowStr) => {
                                    const cellKey = `${colStr}${rowStr}`;
                                    const cell = sheetCells[cellKey];
                                    if (!cell) return 0;
                                    const val = cell.raw.startsWith('=') ? evaluateFormula(cell.raw, sheetCells) : cell.raw;
                                    const num = parseFloat(val);
                                    return isNaN(num) ? `"${val}"` : num;
                                });

                                // Safe mathematical expression evaluation
                                // Replace excel power ^ with JS **
                                sanitizedExpr = sanitizedExpr.replace(/\^/g, '**');

                                // Check for division by zero
                                if (/\/0(?!\d)/.test(sanitizedExpr)) {
                                    return '#DIV/0!';
                                }

                                // Evaluate standard math safely
                                const result = Function(`"use strict"; return (${sanitizedExpr})`)();
                                if (typeof result === 'number') {
                                    return Number.isInteger(result) ? result : parseFloat(result.toFixed(4));
                                }
                                return result;

                            } catch (err) {
                                return '#ERROR!';
                            }
                        }

                        // Helper to extract values list from range e.g. "A1:A5" or single cell "A1"
                        function getValuesFromRange(rangeStr, sheetCells) {
                            const values = [];
                            if (rangeStr.includes(':')) {
                                const [startRef, endRef] = rangeStr.split(':').map(parseCellRef);
                                if (startRef && endRef) {
                                    const minRow = Math.min(startRef.row, endRef.row);
                                    const maxRow = Math.max(startRef.row, endRef.row);
                                    const minCol = Math.min(startRef.col, endRef.col);
                                    const maxCol = Math.max(startRef.col, endRef.col);

                                    for (let r = minRow; r <= maxRow; r++) {
                                        for (let c = minCol; c <= maxCol; c++) {
                                            const key = `${colToName(c)}${r}`;
                                            const cell = sheetCells[key];
                                            if (cell) {
                                                const val = cell.raw.startsWith('=') ? evaluateFormula(cell.raw, sheetCells) : cell.raw;
                                                values.push(val);
                                            } else {
                                                values.push('');
                                            }
                                        }
                                    }
                                }
                            } else {
                                const parsed = parseCellRef(rangeStr);
                                if (parsed) {
                                    const key = `${colToName(parsed.col)}${parsed.row}`;
                                    const cell = sheetCells[key];
                                    if (cell) {
                                        const val = cell.raw.startsWith('=') ? evaluateFormula(cell.raw, sheetCells) : cell.raw;
                                        values.push(val);
                                    }
                                }
                            }
                            return values;
                        }

                        /* ==========================================================================
                           4. SPREADSHEET RENDERER & INTERACTION ENGINE
                           ========================================================================== */

                        function getActiveSheet() {
                            if (!state4.currentWorkbook || !state4.currentWorkbook.sheets) return null;
                            return state4.currentWorkbook.sheets[state4.activeSheetIndex];
                        }

                        function renderGrid() {
                            const sheet = getActiveSheet();
                            if (!sheet) return;

                            const tableHeader = document.getElementById('grid-header-col');
                            const tableBody = document.getElementById('grid-body');
                            const showGridlines = document.getElementById('toggle-gridlines').checked;

                            tableHeader.innerHTML = '';
                            tableBody.innerHTML = '';

                            const numCols = sheet.cols || DEFAULT_COLS;
                            const numRows = sheet.rows || DEFAULT_ROWS;

                            // Header Row (Top Left corner + Column Letters A..Z)
                            let headerRowHTML = `<tr><th class="excel-cell-header top-left-corner"></th>`;
                            for (let c = 1; c <= numCols; c++) {
                                const colName = colToName(c);
                                headerRowHTML += `<th class="excel-cell-header col-header" data-col="${c}">${colName}</th>`;
                            }
                            headerRowHTML += `</tr>`;
                            tableHeader.innerHTML = headerRowHTML;

                            // Grid Rows
                            let bodyHTML = '';
                            for (let r = 1; r <= numRows; r++) {
                                let rowHTML = `<tr><td class="excel-cell-header row-header" data-row="${r}">${r}</td>`;
                                for (let c = 1; c <= numCols; c++) {
                                    const cellKey = `${colToName(c)}${r}`;
                                    const cellData = sheet.cells[cellKey] || { raw: '', style: {} };

                                    // Evaluate value
                                    let displayVal = cellData.raw;
                                    if (cellData.raw && cellData.raw.startsWith('=')) {
                                        displayVal = evaluateFormula(cellData.raw, sheet.cells);
                                    }

                                    // Format Value
                                    displayVal = formatValueByStyle(displayVal, cellData.style?.numFmt);

                                    // CSS Styles
                                    let cellStyle = ``;
                                    if (cellData.style?.bold) cellStyle += `font-weight: bold;`;
                                    if (cellData.style?.italic) cellStyle += `font-style: italic;`;
                                    if (cellData.style?.underline) cellStyle += `text-decoration: underline;`;
                                    if (cellData.style?.strike) cellStyle += `text-decoration: line-through;`;
                                    if (cellData.style?.align) cellStyle += `text-align: ${cellData.style.align};`;
                                    if (cellData.style?.bgColor) cellStyle += `background-color: ${cellData.style.bgColor};`;
                                    if (cellData.style?.textColor) cellStyle += `color: ${cellData.style.textColor};`;
                                    if (!showGridlines) cellStyle += `border-color: transparent;`;

                                    const isSelected = state4.selectedCell.row === r && state4.selectedCell.col === c;
                                    const selectedClass = isSelected ? 'selected' : '';

                                    rowHTML += `<td class="excel-cell ${selectedClass}" 
                                        id="cell-${r}-${c}"
                                        data-row="${r}" 
                                        data-col="${c}" 
                                        style="${cellStyle}"
                                        onclick="selectCell(${r}, ${c})" 
                                        ondblclick="startEditingCell(${r}, ${c})">
                                        ${displayVal !== undefined && displayVal !== null ? displayVal : ''}
                                    </td>`;
                                }
                                rowHTML += `</tr>`;
                                bodyHTML += rowHTML;
                            }
                            tableBody.innerHTML = bodyHTML;

                            updateFormulaBar();
                            updateStatsBar();
                            renderSheetTabs();
                        }

                        // Format cell values
                        function formatValueByStyle(val, numFmt) {
                            if (val === '' || val === null || val === undefined) return '';
                            if (typeof val === 'string' && val.startsWith('#')) return val; // Error badges

                            const num = parseFloat(val);
                            if (isNaN(num)) return val;

                            switch (numFmt) {
                                case 'number':
                                    return num.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                                case 'currency':
                                    return '$' + num.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                                case 'percentage':
                                    return (num * 100).toFixed(1) + '%';
                                default:
                                    return val;
                            }
                        }

                        // Cell Selection Handler
                        function selectCell(row, col) {
                            if (state4.editingCell) {
                                stopEditingCell(true);
                            }

                            // Remove selected class from previous
                            const prevCell = document.getElementById(`cell-${state4.selectedCell.row}-${state4.selectedCell.col}`);
                            if (prevCell) prevCell.classList.remove('selected');

                            state4.selectedCell = { row, col };
                            const nextCell = document.getElementById(`cell-${row}-${col}`);
                            if (nextCell) nextCell.classList.add('selected');

                            updateFormulaBar();
                            updateStatsBar();
                        }

                        // Double Click / F2 Cell Edit
                        function startEditingCell(row, col) {
                            const cellEl = document.getElementById(`cell-${row}-${col}`);
                            if (!cellEl) return;

                            const sheet = getActiveSheet();
                            const cellKey = `${colToName(col)}${row}`;
                            const cellData = sheet.cells[cellKey] || { raw: '' };

                            state4.editingCell = { row, col };
                            cellEl.classList.add('editing');

                            const rawVal = cellData.raw || '';
                            cellEl.innerHTML = `<input type="text" id="active-cell-input" value="${rawVal.replace(/"/g, '&quot;')}" class="w-full h-full bg-transparent border-0 outline-none p-0 font-mono text-xs">`;

                            const inputEl = document.getElementById('active-cell-input');
                            inputEl.focus();
                            inputEl.select();

                            inputEl.addEventListener('keydown', function (e) {
                                if (e.key === 'Enter') {
                                    saveCellInput(row, col, this.value);
                                    selectCell(row + 1, col);
                                } else if (e.key === 'Tab') {
                                    e.preventDefault();
                                    saveCellInput(row, col, this.value);
                                    selectCell(row, col + 1);
                                } else if (e.key === 'Escape') {
                                    renderGrid();
                                }
                            });
                        }

                        function saveCellInput(row, col, value) {
                            pushUndoState();
                            const sheet = getActiveSheet();
                            const cellKey = `${colToName(col)}${row}`;

                            if (!sheet.cells[cellKey]) {
                                sheet.cells[cellKey] = { raw: '', style: {} };
                            }

                            sheet.cells[cellKey].raw = value;
                            state4.editingCell = null;
                            renderGrid();
                            triggerAutoSave();
                        }

                        function stopEditingCell(save = true) {
                            if (!state4.editingCell) return;
                            const inputEl = document.getElementById('active-cell-input');
                            if (inputEl && save) {
                                saveCellInput(state4.editingCell.row, state4.editingCell.col, inputEl.value);
                            } else {
                                state4.editingCell = null;
                                renderGrid();
                            }
                        }

                        // Formula Bar interactions
                        function updateFormulaBar() {
                            const addressEl = document.getElementById('cell-address-indicator');
                            const formulaInput = document.getElementById('formula-bar-input');

                            const cellKey = `${colToName(state4.selectedCell.col)}${state4.selectedCell.row}`;
                            addressEl.innerText = cellKey;

                            const sheet = getActiveSheet();
                            if (sheet && sheet.cells[cellKey]) {
                                formulaInput.value = sheet.cells[cellKey].raw || '';
                            } else {
                                formulaInput.value = '';
                            }
                        }

                        function handleFormulaBarInput(val) {
                            const sheet = getActiveSheet();
                            const cellKey = `${colToName(state4.selectedCell.col)}${state4.selectedCell.row}`;
                            if (!sheet.cells[cellKey]) {
                                sheet.cells[cellKey] = { raw: '', style: {} };
                            }
                            sheet.cells[cellKey].raw = val;
                        }

                        function handleFormulaBarKeyDown(e) {
                            if (e.key === 'Enter') {
                                saveCellInput(state4.selectedCell.row, state4.selectedCell.col, e.target.value);
                                selectCell(state4.selectedCell.row + 1, state4.selectedCell.col);
                            }
                        }

                        // Quick calculation stats at footer
                        function updateStatsBar() {
                            const sheet = getActiveSheet();
                            if (!sheet) return;

                            const cellKey = `${colToName(state4.selectedCell.col)}${state4.selectedCell.row}`;
                            const cell = sheet.cells[cellKey];
                            let val = cell ? (cell.raw.startsWith('=') ? evaluateFormula(cell.raw, sheet.cells) : cell.raw) : 0;
                            const num = parseFloat(val);

                            if (!isNaN(num)) {
                                document.getElementById('stat-sum').innerText = num.toLocaleString();
                                document.getElementById('stat-avg').innerText = num.toLocaleString();
                                document.getElementById('stat-count').innerText = '1';
                            } else {
                                document.getElementById('stat-sum').innerText = '0';
                                document.getElementById('stat-avg').innerText = '0';
                                document.getElementById('stat-count').innerText = cell && cell.raw ? '1' : '0';
                            }
                        }

                        /* ==========================================================================
                           5. FORMATTING & RIBBON ACTIONS
                           ========================================================================== */

                        function applyFormat(type, value = null) {
                            pushUndoState();
                            const sheet = getActiveSheet();
                            const cellKey = `${colToName(state4.selectedCell.col)}${state4.selectedCell.row}`;

                            if (!sheet.cells[cellKey]) {
                                sheet.cells[cellKey] = { raw: '', style: {} };
                            }
                            if (!sheet.cells[cellKey].style) {
                                sheet.cells[cellKey].style = {};
                            }

                            const style = sheet.cells[cellKey].style;

                            switch (type) {
                                case 'bold':
                                    style.bold = !style.bold;
                                    break;
                                case 'italic':
                                    style.italic = !style.italic;
                                    break;
                                case 'underline':
                                    style.underline = !style.underline;
                                    break;
                                case 'strike':
                                    style.strike = !style.strike;
                                    break;
                                case 'align':
                                    style.align = value;
                                    break;
                                case 'bgColor':
                                    style.bgColor = value;
                                    break;
                                case 'textColor':
                                    style.textColor = value;
                                    break;
                                case 'numFmt':
                                    style.numFmt = value;
                                    break;
                            }

                            renderGrid();
                            triggerAutoSave();
                        }

                        /* ==========================================================================
                           7. IMPORT & EXPORT SYSTEM (SheetJS XLSX)
                           ========================================================================== */

                        function handleFileImport(event) {
                            const file = event.target.files[0];
                            if (!file) return;

                            const reader = new FileReader();
                            reader.onload = function (e) {
                                try {
                                    const data = new Uint8Array(e.target.result);
                                    const workbook = XLSX.read(data, { type: 'array' });

                                    if (!workbook.SheetNames || workbook.SheetNames.length === 0) {
                                        throw new Error('El archivo no contiene hojas válidas.');
                                    }

                                    const newWorkbook = {
                                        title: file.name.replace(/\.[^/.]+$/, ""),
                                        createdAt: new Date().toISOString(),
                                        updatedAt: new Date().toISOString(),
                                        sheets: []
                                    };

                                    workbook.SheetNames.forEach(sheetName => {
                                        const worksheet = workbook.Sheets[sheetName];
                                        const range = XLSX.utils.decode_range(worksheet['!ref'] || 'A1:Z100');

                                        const sheetCells = {};
                                        for (let R = range.s.r; R <= range.e.r; ++R) {
                                            for (let C = range.s.c; C <= range.e.c; ++C) {
                                                const cellAddress = XLSX.utils.encode_cell({ c: C, r: R });
                                                const cell = worksheet[cellAddress];
                                                if (cell && cell.v !== undefined) {
                                                    sheetCells[cellAddress] = {
                                                        raw: cell.f ? '=' + cell.f : String(cell.v),
                                                        style: {}
                                                    };
                                                }
                                            }
                                        }

                                        newWorkbook.sheets.push({
                                            id: Date.now() + Math.random(),
                                            name: sheetName,
                                            rows: Math.max(DEFAULT_ROWS, range.e.r + 1),
                                            cols: Math.max(DEFAULT_COLS, range.e.c + 1),
                                            cells: sheetCells
                                        });
                                    });

                                    state4.currentWorkbook = newWorkbook;
                                    state4.activeSheetIndex = 0;
                                    saveCurrentWorkbook(true);
                                    switchView('editor');
                                    showToast('Importación Exitosa', `Archivo "${file.name}" cargado correctamente.`, 'success');

                                } catch (err) {
                                    showToast('Error de Importación', 'No se pudo leer el archivo Excel: ' + err.message, 'error');
                                }
                            };

                            reader.readAsArrayBuffer(file);
                        }

                        function exportToXLSX() {
                            if (!state4.currentWorkbook) return;

                            try {
                                const wb = XLSX.utils.book_new();

                                state4.currentWorkbook.sheets.forEach(sheet => {
                                    const aoa = [];
                                    const maxRow = sheet.rows || DEFAULT_ROWS;
                                    const maxCol = sheet.cols || DEFAULT_COLS;

                                    for (let r = 1; r <= maxRow; r++) {
                                        const rowData = [];
                                        for (let c = 1; c <= maxCol; c++) {
                                            const cellKey = `${colToName(c)}${r}`;
                                            const cell = sheet.cells[cellKey];
                                            if (cell) {
                                                const val = cell.raw.startsWith('=') ? evaluateFormula(cell.raw, sheet.cells) : cell.raw;
                                                rowData.push(val);
                                            } else {
                                                rowData.push('');
                                            }
                                        }
                                        aoa.push(rowData);
                                    }

                                    const ws = XLSX.utils.aoa_to_sheet(aoa);
                                    XLSX.utils.book_append_sheet(wb, ws, sheet.name);
                                });

                                XLSX.writeFile(wb, `${state4.currentWorkbook.title || 'ExcelStudio'}.xlsx`);
                                showToast('Exportación completada', 'Archivo descargado en formato .xlsx', 'success');
                            } catch (err) {
                                showToast('Error al exportar', err.message, 'error');
                            }
                        }

                        function exportToCSV() {
                            const sheet = getActiveSheet();
                            if (!sheet) return;

                            let csvContent = "";
                            const maxRow = sheet.rows || DEFAULT_ROWS;
                            const maxCol = sheet.cols || DEFAULT_COLS;

                            for (let r = 1; r <= maxRow; r++) {
                                const rowVals = [];
                                for (let c = 1; c <= maxCol; c++) {
                                    const cellKey = `${colToName(c)}${r}`;
                                    const cell = sheet.cells[cellKey];
                                    let val = cell ? (cell.raw.startsWith('=') ? evaluateFormula(cell.raw, sheet.cells) : cell.raw) : '';
                                    rowVals.push(`"${String(val).replace(/"/g, '""')}"`);
                                }
                                csvContent += rowVals.join(",") + "\n";
                            }

                            const blob_test2 = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                            const link = document.createElement("a");
                            const url = URL.createObjectURL(blob_test2);
                            link.setAttribute("href", url);
                            link.setAttribute("download", `${sheet.name}.csv`);
                            document.body.appendChild(link);
                            link.click();
                            document.body.removeChild(link);

                            showToast('CSV Exportado', `Hoja ${sheet.name} guardada como CSV.`, 'success');
                        }

                            try {
                                const id = await db_excel.workbooks.put(state4.currentWorkbook);

                                // Send to Web Worker for background validation
                                autoSaveWorker.postMessage({
                                    type: 'PROCESS_AUTOSAVE',

                                    showToast('Guardado', `El libro "${state4.currentWorkbook.title}" se guardó correctamente.`, 'success');

                        /* ==========================================================================

                        function pushUndoState() {
                            if (!state4.currentWorkbook) return;
                            state4.undoStack.push(JSON.stringify(state4.currentWorkbook));
                            if (state4.undoStack.length > 30) state4.undoStack.shift(); // Max 30 levels
                            state4.redoStack = [];
                        }

                        function undo() {
                            if (state4.undoStack.length === 0) return;
                            state4.redoStack.push(JSON.stringify(state4.currentWorkbook));
                            const prev = state4.undoStack.pop();
                            state4.currentWorkbook = JSON.parse(prev);
                            renderGrid();
                            triggerAutoSave();
                            showToast('Deshecho', 'Acción deshecha.', 'info');
                        }

                        function redo() {
                            if (state4.redoStack.length === 0) return;
                            state4.undoStack.push(JSON.stringify(state4.currentWorkbook));
                            const next = state4.redoStack.pop();
                            state4.currentWorkbook = JSON.parse(next);
                            renderGrid();
                            triggerAutoSave();
                            showToast('Rehecho', 'Acción rehecha.', 'info');
                        }
