        <body class="light-mode">
    
            <header id="header" class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-4">
                <div id="header-container-left" class="d-flex gap-2 align-items-center"></div>
                <span class="navbar-brand fw-bold text-primary mx-3">File Viewer</span>
                <div id="header-container-right" class="d-flex gap-2 align-items-center me-auto"></div>
                <div id="header-container-end" class="d-flex gap-2 align-items-center"></div>
            </header>
    
            <div id="wrapper">
                <nav id="nav-panel">
                    <div id="nav-dynamic-content" class="w-100"></div>
                </nav>
                <main id="main-content"></main>
                <aside id="aside-panel" class="collapsed p-3">
                    <h6 class="fw-bold x-small text-uppercase text-muted section-title-label">Gestor de Ventanas</h6>
                    <hr class="my-2">
                    <div id="window-list" class="small d-flex flex-column gap-1"></div>
                    <div id="window-inspector" class="mt-4 d-none">
                        <h6 class="fw-bold x-small text-uppercase text-primary">Inspector de Estilos</h6>
                        <div id="inspector-content"></div>
                    </div>
                </aside>
            </div>
    
            <footer id="footer" class="bg-white border-top d-flex align-items-center px-4 justify-content-between">
                <small class="text-muted" id="footer-tag">&copy; 2024 App Studio</small>
                <div id="db-status-footer" class="small text-primary">Listo</div>
            </footer>
    
            <script>
                let activeDBName = "DB_List_04";//localStorage.getItem('activeDB') ||
                // db;

                const app = {
                    windowCounter: 0,

                    async init() {
                        this.initDB(activeDBName);
                        const theme = await db.settings.get('theme');
                        if (theme?.value === 'dark') ui.toggleTheme(true);

                        if (await db.nav_elements.count() === 0) {
                            await this.resetDatabaseFromTemplate(false);
                        }

                        await this.renderNav();
                        await this.renderHeader();
                        this.updateDBStatus();
                        $('#db-selector').val(activeDBName);

                        $(document).on('shown.bs.tab', '#dbTabs button', function (e) {
                            const target = $(e.target).attr('data-bs-target');
                            $('.tab-specific-control').addClass('d-none');
                            if (target === '#tpl-db-pane') $('#tpl-controls').removeClass('d-none');
                            else if (target === '#html-tpl-pane') $('#html-controls').removeClass('d-none');
                            else if (target === '#real-db-pane') $('#real-controls').removeClass('d-none');
                        });
                        console.log(ui);
                        console.log(app);
                    },

                    initDB(name) {
                        db = new Dexie(name);
                        db.version(2).stores({
                            settings: 'id, value',
                            tasks: '++id, title, status',
                            nav_elements: '++id, section, label, icon, view',
                            header_elements: '++id, label, icon, action, position',
                            window_buttons: '++id, label, icon, action, class',
                            window_config: '++id, width, height, position',
                            actions_registry: '++id, component, action, code, params, desc',
                            usuarios: '++id, nombre, rol',
                            productos: '++id, item, stock',
                            html_templates: '++id, tag_id, content'
                        });
                    },

                    async changeDatabase(newName) {
                        activeDBName = newName;
                        localStorage.setItem('activeDB', newName);
                        $('.app-window').remove();
                        this.windowCounter = 0;
                        this.initDB(newName);
                        if (await db.nav_elements.count() === 0) {
                            await this.resetDatabaseFromTemplate(false, newName);
                        }
                        await this.renderNav();
                        await this.renderHeader();
                        this.updateDBStatus();
                        this.updateWindowList();

                        $('#db-active-label').text(newName);
                        $('#db-alert-indicator').text(`Conectado a ${newName}`);
                    },

                    async resetDatabaseFromTemplate(refreshUI = true, dbNameHint = "") {
                        const schemaHtml = $('#tpl-arrays').html();
                        const tempDiv = $('<div>').append(schemaHtml);
                        const jsonData = JSON.parse(tempDiv.find('#schema-data').text());

                        if (activeDBName.includes('Test')) {
                            jsonData.nav_elements[0].label = "Panel Beta";
                            jsonData.usuarios = [{ "id": 1, "nombre": "Tester 01", "rol": "QA" }, { "id": 2, "nombre": "Tester 02", "rol": "QA" }];
                        } else if (activeDBName.includes('Dev')) {
                            jsonData.nav_elements.push({ "section": "Debug", "label": "Logs", "icon": "🐛", "view": "test" });
                        }

                        const tables = Object.keys(jsonData);
                        for (let table of tables) {
                            if (db[table]) {
                                await db[table].clear();
                                await db[table].bulkAdd(jsonData[table]);
                            }
                        }
                        if (refreshUI) { this.renderNav(); this.renderHeader(); this.refreshDatabaseView(); this.loadWinPrefs(); }
                    },

                    async renderNav() {
                        let navData = await db.nav_elements.toArray();
                        const container = $('#nav-dynamic-content').empty();
                        const sections = [...new Set(navData.map(item => item.section))];
                        sections.forEach(sec => {
                            const div = $('<div class="nav-section-container"></div>');
                            div.append(`<small class="text-uppercase fw-bold x-small nav-section-title d-block mb-1">${sec}</small>`);
                            const group = $('<div class="nav flex-column"></div>');
                            navData.filter(i => i.section === sec).forEach(item => {
                                const link = $(`<a class="nav-link x-small" data-view="${item.view}" title="${item.label}">
                                <span class="nav-icon">${item.icon}</span>
                                <span class="nav-label">${item.label}</span>
                            </a>`);
                                link.on('click', () => {
                                    $('.nav-link').removeClass('active');
                                    link.addClass('active');
                                    app.createWindow(item.view, item.label);
                                });
                                group.append(link);
                            });
                            container.append(div.append(group));
                        });
                    },

                    async renderHeader() {
                        const headerData = await db.header_elements.toArray();
                        const cLeft = $('#header-container-left').empty();
                        const cEnd = $('#header-container-end').empty();
                        headerData.forEach(item => {
                            let act = item.action === 'toggle-nav' ? "ui.togglePanel('nav')" : item.action === 'toggle-aside' ? "ui.togglePanel('aside')" : item.action === 'fullscreen' ? "ui.toggleFullScreen()" : "";
                            const btn = `<button class="btn btn-sm btn-light border x-small" onclick="${act}">${item.icon} ${item.label}</button>`;
                            item.position === 'left' ? cLeft.append(btn) : cEnd.append(btn);
                        });
                    },

                    renderTemplateData() {
                        const container = $('#template-data-view').empty();
                        const schemaHtml = $('#tpl-arrays').html();
                        const tempDiv = $('<div>').append(schemaHtml);
                        const jsonData = JSON.parse(tempDiv.find('#schema-data').text());

                        Object.keys(jsonData).forEach((table, idx) => {
                            if (jsonData[table]?.length) {
                                const collapseId = `tpl-collapse-${idx}`;
                                let html = `<div class="mb-2 border rounded overflow-hidden">
                                <div class="collapsible-header x-small p-2 fw-bold text-uppercase d-flex align-items-center collapsed" data-bs-toggle="collapse" data-bs-target="#${collapseId}"><span class="collapse-icon">▼</span> ${table}</div>
                                <div id="${collapseId}" class="collapse"><table class="table table-sm table-mini border-top mb-0"><thead><tr>`;
                                const headers = Object.keys(jsonData[table][0]);
                                headers.forEach(h => html += `<th>${h}</th>`);
                                html += `</tr></thead><tbody>`;
                                jsonData[table].forEach(row => { html += `<tr>`; headers.forEach(h => html += `<td>${row[h]}</td>`); html += `</tr>`; });
                                container.append(html + `</tbody></table></div></div>`);
                            }
                        });
                    },

                    renderHtmlTemplates() {
                        const container = $('#html-templates-view').empty();
                        const templates = document.querySelectorAll('head template');

                        if (templates.length === 0) {
                            container.append('<div class="x-small text-center py-4 text-muted">No se encontraron etiquetas template en el HEAD.</div>');
                            return;
                        }

                        templates.forEach(t => {
                            const id = t.id || 'Sin ID';
                            if (id === 'tpl-arrays') return; // Saltar schema data para simplificar
                            const contentPreview = t.innerHTML.substring(0, 100).replace(/</g, "&lt;") + "...";
                            const card = $(`
                            <div class="card mb-2">
                                <div class="card-body p-2 d-flex justify-content-between align-items-center">
                                    <div style="max-width: 75%;">
                                        <div class="fw-bold x-small text-primary">#${id}</div>
                                        <div class="x-small text-muted font-monospace text-truncate">${contentPreview}</div>
                                    </div>
                                    <button class="btn btn-xs btn-primary" onclick="app.importHtmlTemplate('${id}')">Instanciar</button>
                                </div>
                            </div>
                        `);
                            container.append(card);
                        });
                    },

                    async importHtmlTemplate(tagId) {
                        const template = document.getElementById(tagId);
                        if (!template) return;
                        const content = template.innerHTML;

                        // Evitamos duplicaciones
                        const existing = await db.html_templates.where('tag_id').equals(tagId).first();
                        if (existing) {
                            await db.html_templates.update(existing.id, { content: content });
                        } else {
                            await db.html_templates.add({ tag_id: tagId, content: content });
                        }

                        // feedback no bloqueante (evitando alert())
                        $('#db-status-footer').text(`[OK] Template #${tagId} instanciado.`);
                        setTimeout(() => app.updateDBStatus(), 3000);

                        this.refreshDatabaseView();
                    },

                    async loadWinPrefs() {
                        const conf = await db.window_config.get(1);
                        if (conf) { $('#win-pref-width').val(conf.width); $('#win-pref-height').val(conf.height); $('#win-pref-pos').val(conf.position); }
                    },

                    async saveWinPrefs() {
                        const updated = { id: 1, width: parseInt($('#win-pref-width').val()) || 400, height: parseInt($('#win-pref-height').val()) || 300, position: $('#win-pref-pos').val() };
                        await db.window_config.put(updated);
                    },

                    async refreshDatabaseView() {
                        const tableNames = db.tables.map(t => t.name).filter(name => name !== 'settings');
                        $("#nav-db-table-container, #header-db-table-container, #win-btn-table-container, #actions-registry-table-container, #html-store-table-container").empty();
                        $('#live-db-tables-view').empty();
                        for (let table of tableNames) {
                            const data = await db[table].toArray();
                            this.renderEditableTable(table, data);
                            this.renderLiveTableInDatabaseView(table, data);
                        }
                    },

                    renderLiveTableInDatabaseView(table, data) {
                        const container = $('#live-db-tables-view');
                        if (!container.length) return;
                        const collapseId = `live-collapse-${table}`;
                        let html = `<div class="mb-2 border rounded overflow-hidden">
                        <div class="collapsible-header x-small p-2 fw-bold text-uppercase d-flex align-items-center collapsed" data-bs-toggle="collapse" data-bs-target="#${collapseId}"><span class="collapse-icon">▼</span> ${table} (${data.length})</div>
                        <div id="${collapseId}" class="collapse">`;
                        if (data.length > 0) {
                            const headers = Object.keys(data[0]);
                            html += `<table class="table table-sm table-mini table-hover border-top mb-0"><thead><tr>`;
                            headers.forEach(h => html += `<th>${h}</th>`);
                            html += `<th>×</th></tr></thead><tbody>`;
                            data.forEach(row => {
                                html += `<tr>`;
                                headers.forEach(h => {
                                    let val = row[h];
                                    if (typeof val === 'string' && val.length > 50) val = val.substring(0, 47) + "...";
                                    html += `<td title="${row[h]}">${val}</td>`;
                                });
                                html += `<td><button class="btn btn-xs btn-danger" onclick="app.deleteRow('${table}', ${row.id})">×</button></td></tr>`;
                            });
                            html += `</tbody></table>`;
                        } else { html += `<div class="p-2 x-small text-muted italic">Tabla vacía</div>`; }
                        html += `</div></div>`;
                        container.append(html);
                    },

                    renderEditableTable(table, data) {
                        let targetId = "";
                        if (table === 'nav_elements') targetId = "#nav-db-table-container";
                        else if (table === 'header_elements') targetId = "#header-db-table-container";
                        else if (table === 'window_buttons') targetId = "#win-btn-table-container";
                        else if (table === 'actions_registry') targetId = "#actions-registry-table-container";
                        else if (table === 'html_templates') targetId = "#html-store-table-container";

                        if (!$(targetId).length) return;

                        let headers = data.length > 0 ? Object.keys(data[0]).filter(h => h !== 'id') : [];
                        if (headers.length === 0) {
                            if (table === 'html_templates') headers = ['tag_id', 'content'];
                            else return;
                        }

                        let html = `<table class="table table-sm table-mini border mt-2"><thead><tr class="bg-light">`;
                        headers.forEach(h => html += `<th class="text-uppercase">${h}</th>`);
                        html += `<th>×</th></tr></thead><tbody>`;
                        data.forEach(row => {
                            html += `<tr data-id="${row.id}">`;
                            headers.forEach(h => {
                                let display = row[h];
                                if (typeof display === 'string' && display.length > 30) display = display.substring(0, 27) + "...";
                                html += `<td class="editable-cell" data-field="${h}" title="${row[h]}">${display}</td>`;
                            });
                            html += `<td><button class="btn btn-xs btn-danger" onclick="app.deleteRow('${table}', ${row.id})">×</button></td></tr>`;
                        });
                        html += `<tr class="bg-light add-row" data-table="${table}">`;

                        // Generar inputs dinámicos o Textarea si corresponde al campo 'content' de html_templates
                        headers.forEach(h => {
                            if (table === 'html_templates' && h === 'content') {
                                html += `<td><textarea class="add-row-input form-control form-control-sm x-small" data-field="${h}" placeholder="+" rows="2" style="width: 100%; min-width: 150px; font-size: 0.7rem;"></textarea></td>`;
                            } else {
                                html += `<td><input type="text" class="add-row-input" data-field="${h}" placeholder="+"></td>`;
                            }
                        });

                        html += `<td><button class="btn btn-xs btn-primary" onclick="app.addNewRow('${table}', this)">+</button></td></tr>`;
                        $(targetId).html(html + "</tbody></table>");
                        $(targetId).find('.editable-cell').on('click', function () {
                            if ($(this).find('input, textarea').length) return;
                            const val = $(this).attr('title') || $(this).text(), field = $(this).data('field'), id = $(this).closest('tr').data('id');

                            let input;
                            if (table === 'html_templates' && field === 'content') {
                                input = $(`<textarea class="editable-input form-control form-control-sm x-small" rows="6">${val}</textarea>`);
                            } else {
                                input = $(`<input type="text" class="editable-input" value="${val}">`);
                            }

                            $(this).html(input);
                            input.focus().on('blur', async function () {
                                const newVal = $(this).val();
                                await db[table].update(id, { [field]: newVal });
                                app.refreshDatabaseView();
                                if (table === 'nav_elements') app.renderNav();
                                if (table === 'header_elements') app.renderHeader();
                            });

                            // Solo cerrar al pulsar Enter si NO es un textarea de código
                            input.on('keypress', function (e) {
                                if (e.which === 13 && !$(this).is('textarea')) $(this).blur();
                            });
                        });
                    },

                    async addNewRow(table, btn) {
                        const row = $(btn).closest('tr'), newItem = {};
                        row.find('input, textarea').each(function () { newItem[$(this).data('field')] = $(this).val(); });
                        if (Object.values(newItem).every(v => v === "")) return;
                        await db[table].add(newItem);
                        this.refreshDatabaseView();
                        if (table === 'nav_elements') this.renderNav();
                        if (table === 'header_elements') this.renderHeader();
                    },

                    async deleteRow(table, id) {
                        await db[table].delete(id);
                        this.refreshDatabaseView();
                        if (table === 'nav_elements') this.renderNav();
                        if (table === 'header_elements') this.renderHeader();
                    },

                    async createWindow(viewId, title) {
                        if ($(`.app-window[data-origin-view="${viewId}"]`).length > 0) return;
                        $(`.nav-link[data-view="${viewId}"]`).addClass('disabled');

                        const winButtons = await db.window_buttons.toArray();
                        const config = await db.window_config.get(1) || { width: 420, height: 300, position: 'cascade' };

                        this.windowCounter++;
                        const winId = `win-${this.windowCounter}`;

                        let top = 40, left = 40;
                        const containerWidth = $('#main-content').width();
                        const containerHeight = $('#main-content').height();

                        if (config.position === 'cascade') {
                            const visibleWindows = $('.app-window:not(.minimized)').length;
                            const offset = 25;
                            top = 40 + (visibleWindows * offset);
                            left = 40 + (visibleWindows * offset);
                            if (left + config.width > containerWidth - 20 || top + config.height > containerHeight - 20) {
                                top = 40;
                                left = 40;
                            }
                        } else if (config.position === 'center') {
                            top = (containerHeight - config.height) / 2;
                            left = (containerWidth - config.width) / 2;
                        }

                        const winHtml = `<div id="${winId}" class="app-window" data-origin-view="${viewId}" style="top:${top}px; left:${left}px; width:${config.width}px; height:${config.height}px;">
                        <div class="window-header"><span class="window-title x-small fw-bold">${title}</span><div class="window-controls"></div></div>
                        <div class="window-body" id="body-${winId}"></div>
                    </div>`;

                        const $win = $(winHtml);
                        $('#main-content').append($win);

                        const $controls = $win.find('.window-controls');
                        winButtons.forEach(btnConfig => {
                            const $btn = $(`<button class="win-btn ${btnConfig.class}">${btnConfig.icon}</button>`);
                            $btn.on('click', (e) => {
                                e.stopPropagation();
                                if (btnConfig.action === 'close') app.closeWindow(winId);
                                else if (btnConfig.action === 'maximize') app.toggleMaximizeWindow(winId);
                                else if (btnConfig.action === 'minimize') app.toggleMinimizeWindow(winId);
                                else if (btnConfig.action === 'toggle-header') app.toggleWindowHeader(winId);
                            });
                            $controls.append($btn);
                        });

                        // --- SISTEMA DE RESOLUCIÓN HÍBRIDA DE PLANTILLAS ---
                        let contentHtml = "";
                        // 1. Buscamos primero si ha sido instanciada en la pestaña 'Live HTML' (Dexie table html_templates)
                        const liveTemplate = await db.html_templates.where('tag_id').equals(`tpl-${viewId}`).first()
                            || await db.html_templates.where('tag_id').equals(viewId).first();

                        if (liveTemplate) {
                            contentHtml = liveTemplate.content;
                        } else {
                            // 2. Si no está en Live, buscamos la plantilla estática tradicional en el HEAD
                            const tpl = document.getElementById(`tpl-${viewId}`) || document.getElementById(viewId);
                            if (tpl) {
                                contentHtml = tpl.innerHTML;
                            }
                        }

                        if (contentHtml) {
                            $(`#body-${winId}`).html(contentHtml);
                        } else {
                            $(`#body-${winId}`).html(`<div class="p-3 text-danger x-small">No se pudo cargar la plantilla "${viewId}".</div>`);
                        }
                        // ---------------------------------------------------

                        $win.draggable({ handle: ".window-header", containment: "#main-content", stack: ".app-window" }).resizable();

                        if (viewId === 'config') { this.refreshDatabaseView(); this.loadWinPrefs(); }
                        if (viewId === 'database') { this.refreshDatabaseView(); this.renderTemplateData(); }
                        if (viewId === 'tasks') this.refreshTasks(winId);
                        if (viewId === 'dashboard') { $('#db-active-label').text(activeDBName); }
                        this.updateWindowList();
                        $win.trigger('mousedown');
                    },

                    toggleWindowHeader(id) { $(`#${id}`).toggleClass('no-header'); },
                    toggleMaximizeWindow(id) { const w = $(`#${id}`); w.hasClass('maximized') ? w.removeClass('maximized').draggable("enable") : w.addClass('maximized').draggable("disable"); },
                    toggleMinimizeWindow(id) { $(`#${id}`).toggleClass('minimized'); },
                    closeWindow(id) {
                        const origin = $(`#${id}`).attr('data-origin-view');
                        $(`.nav-link[data-view="${origin}"]`).removeClass('disabled');
                        $(`#${id}`).remove();
                        this.updateWindowList();
                        $('#window-inspector').addClass('d-none');
                    },

                    async addTask() {
                        const val = $('#taskInput').val(); if (!val) return;
                        await db.tasks.add({ title: val, status: 'pending' });
                        $('#taskInput').val('');
                        this.refreshTasks($('.app-window[data-origin-view="tasks"]').attr('id'));
                        this.updateDBStatus();
                    },
                    async refreshTasks(id) {
                        const data = await db.tasks.toArray();
                        const container = $(`#${id} #task-list-container`).empty();
                        data.forEach(t => container.append(`<li class="list-group-item d-flex justify-content-between p-1 x-small"><span>${t.title}</span><button class="btn btn-xs text-danger" onclick="app.deleteTask(${t.id}, '${id}')">×</button></li>`));
                    },
                    async deleteTask(id, winId) { await db.tasks.delete(id); this.refreshTasks(winId); this.updateDBStatus(); },
                    updateDBStatus() { db.tasks.count().then(c => $('#db-status-footer').text(`DB: ${activeDBName.split('_')[1]} | Tareas: ${c}`)); },

                    updateWindowList() {
                        const list = $('#window-list').empty();
                        $('.app-window').each(function () {
                            const id = $(this).attr('id');
                            const title = $(this).find('.window-title').text();
                            const item = $(`<div class="win-list-item p-2 x-small border fw-bold" data-win-id="${id}">${title}</div>`);
                            item.on('click', () => {
                                $('.win-list-item').removeClass('selected');
                                item.addClass('selected');
                                $(`#${id}`).css('z-index', 1000).trigger('mousedown');
                                app.inspectWindow(id);
                            });
                            list.append(item);
                        });
                    },

                    inspectWindow(id) {
                        const win = $(`#${id}`);
                        const body = win.find('.window-body');
                        const inspector = $('#window-inspector').removeClass('d-none');
                        const content = $('#inspector-content').empty();

                        let html = `<div class="stats-card">
                        <div class="x-small fw-bold border-bottom mb-2 pb-1">Geometría</div>
                        <div class="x-small">W: ${win.width()}px | H: ${win.height()}px</div>
                        <div class="x-small">Pos: T:${parseInt(win.css('top'))} L:${parseInt(win.css('left'))}</div>
                    </div>`;

                        const components = {
                            "Botones": body.find('button').length,
                            "Inputs": body.find('input, select').length,
                            "Listas": body.find('ul, table').length,
                            "Alertas": body.find('.alert').length
                        };

                        html += `<div class="stats-card">
                        <div class="x-small fw-bold border-bottom mb-2 pb-1">Componentes</div>
                        <div class="d-flex flex-wrap gap-2">`;
                        for (let key in components) {
                            if (components[key] > 0) html += `<div class="badge bg-light text-dark border x-small">${key}: ${components[key]}</div>`;
                        }
                        html += `</div></div>`;

                        const mainBtn = body.find('button.btn-primary').first();
                        if (mainBtn.length) {
                            const styles = window.getComputedStyle(mainBtn[0]);
                            html += `<div class="stats-card">
                            <div class="x-small fw-bold border-bottom mb-2 pb-1">Estilo (Botón Principal)</div>
                            <div class="x-small">Color: <span style="color:${styles.backgroundColor}">⬤</span> ${styles.backgroundColor}</div>
                            <div class="x-small">Radio: ${styles.borderRadius}</div>
                            <div class="x-small">Font: ${styles.fontSize}</div>
                        </div>`;
                        }

                        content.append(html);
                    }
                };

                const ui = {
                    togglePanel(id) { $(`#${id}-panel`).toggleClass('collapsed'); },
                    toggleTheme(init) {
                        const b = $('body');
                        if (init) { b.addClass('dark-mode'); b.removeClass('light-mode'); $('#themeSwitch').prop('checked', true); }
                        else {
                            b.toggleClass('dark-mode');
                            b.toggleClass('light-mode');
                            db.settings.put({ id: 'theme', value: b.hasClass('dark-mode') ? 'dark' : 'light' });
                        }
                    },
                    toggleFullScreen() { !document.fullscreenElement ? document.documentElement.requestFullscreen() : document.exitFullscreen(); }
                };

                $(document).ready(() => app.init());
            </script>
        </body>
    
        </html>
    
    </template>
</head>

                <span class="font-bold text-[10px] text-gray-500 dark:text-gray-400 uppercase tracking-widest">Inspector Avanzado</span>
                <button onclick="toggleSection('aside')" class="p-1 hover:bg-gray-200 dark:hover:bg-slate-700 rounded">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>
            
            <div id="inspector-root" class="flex-1 overflow-y-auto pb-10">
                <div class="p-10 text-center opacity-30 text-xs">
                    <p>Selecciona una ventana para iniciar inspección.</p>
                </div>
            </div>
        </aside>

        <button id="aside-expand-btn" onclick="toggleSection('aside')" class="hidden absolute right-0 top-1/2 -translate-y-1/2 bg-white dark:bg-slate-800 border border-r-0 p-2 shadow-lg z-40 rounded-l-lg">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="11 17 6 12 11 7"></polyline></svg>
        </button>
    </div>

    <footer id="footer" class="collapsible bg-white border-t p-2 flex items-center gap-2 text-[10px] font-mono min-h-[40px] overflow-x-auto overflow-y-hidden z-50">
        <div class="flex gap-4 px-4 border-r mr-2 shrink-0">
            <span id="storage-status" class="text-emerald-600 font-bold">DEXIE_OK</span>
        </div>
        <div id="minimized-tasks" class="flex items-center gap-2 flex-1"></div>
        <button onclick="toggleSection('footer')" class="opacity-30 hover:opacity-100 px-4 shrink-0">Ocultar</button>
    </footer>

    <button id="footer-expand-btn" onclick="toggleSection('footer')" class="expand-trigger bottom-0 left-1/2 -translate-x-1/2 px-4 py-1 rounded-t-lg border-b-0 text-[10px] font-bold uppercase widest">
        Expandir Footer
    </button>

    <script>
        let db, state;

        db = new Dexie("Lista_05"); 
        db.version(1).stores({
            settings: "key, value",
            bookmarks: "++id, url, title, autoLoad, useMiniBrowser"
        });

        state = {
            activeWindows: [],
            focusedWindowId: null,
            internalOpen: { db: false, config: false },
            selectedDomNodes: new Set(),
            darkMode: false,
            editingBookmarkId: null,
            faviconUrl: null,
            mainBgUrl: null,
            activeSettingsTab: 'tema',
            accentColor: 'amber',
            highContrast: false,
            encryptExports: false,
            startEngine: true,
            appName: 'APP_CORE v2.8.5',
            appDensity: 'comoda',
            appAnimations: true
        };

        const ICONS = {
            web: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`,
            module: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>`,
            db: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>`,
            config: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1-2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`
        };

        function enableWindowInteractions(id) {
            const win = $(`#${id}`);

            win.draggable({
                handle: '.window-header',
                containment: '#main',
                stack: '.window-card',
                start: function() {
                    $('.iframe-overlay').show();
                },
                stop: function() {
                    $('.iframe-overlay').hide();
                }
            });

            win.resizable({
                containment: '#main',
                handles: 'all',
                minWidth: 280,
                minHeight: 180,
                start: function() {
                    $('.iframe-overlay').show();
                },
                stop: function() {
                    $('.iframe-overlay').hide();
                }
            });
        }

        function toggleMaximize(id) {
            const win = $(`#${id}`);
            win.toggleClass('window-maximized');
            if (win.hasClass('window-maximized')) {
                if (win.data('ui-draggable')) win.draggable('disable');
                if (win.data('ui-resizable')) win.resizable('disable');
            } else {
                if (win.data('ui-draggable')) win.draggable('enable');
                if (win.data('ui-resizable')) win.resizable('enable');
            }
        }

        async function initTheme() {
            const savedTheme = await db.settings.get('darkMode');
            if (savedTheme && savedTheme.value) {
                toggleDarkMode(true);
            }

            const savedFavicon = await db.settings.get('favicon');
            if (savedFavicon && savedFavicon.value) {
                state.faviconUrl = savedFavicon.value;
                applyFavicon(savedFavicon.value);
            }

            const savedMainBg = await db.settings.get('mainBg');
            if (savedMainBg && savedMainBg.value) {
                state.mainBgUrl = savedMainBg.value;
                applyMainBackground(savedMainBg.value);
            }
        }

        function applyFavicon(url) {
            let link = document.getElementById('app-favicon');
            if (!link) {
                link = document.createElement('link');
                link.id = 'app-favicon';
                link.rel = 'icon';
                document.head.appendChild(link);
            }
            if (url) {
                link.href = url;
            } else {
                link.removeAttribute('href');
            }
        }

        function applyMainBackground(url) {
            const main = document.getElementById('main');
            if (!main) return;
            if (url) {
                main.style.backgroundImage = `url("${url}")`;
                main.style.backgroundSize = 'cover';
                main.style.backgroundPosition = 'center';
                main.style.backgroundRepeat = 'no-repeat';
            } else {
                main.style.backgroundImage = '';
                main.style.backgroundSize = '';
                main.style.backgroundPosition = '';
                main.style.backgroundRepeat = '';
            }
        }

        function handleFaviconUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                const dataUrl = e.target.result;
                await db.settings.put({ key: 'favicon', value: dataUrl });
                state.faviconUrl = dataUrl;
                applyFavicon(dataUrl);
                if (state.focusedWindowId) renderConfig(state.focusedWindowId);
            };
            reader.readAsDataURL(file);
        }

        async function removeFavicon() {
            await db.settings.delete('favicon');
            state.faviconUrl = null;
            applyFavicon(null);
            if (state.focusedWindowId) renderConfig(state.focusedWindowId);
        }

        function handleMainBgUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                const dataUrl = e.target.result;
                await db.settings.put({ key: 'mainBg', value: dataUrl });
                state.mainBgUrl = dataUrl;
                applyMainBackground(dataUrl);
                if (state.focusedWindowId) renderConfig(state.focusedWindowId);
            };
            reader.readAsDataURL(file);
        }

        async function removeMainBg() {
            await db.settings.delete('mainBg');
            state.mainBgUrl = null;
            applyMainBackground(null);
            if (state.focusedWindowId) renderConfig(state.focusedWindowId);
        }

        async function toggleDarkMode(isInit = false) {
            state.darkMode = isInit ? true : !state.darkMode;
            if (state.darkMode) {
                $('#app-body').addClass('dark-mode dark');
            } else {
                $('#app-body').removeClass('dark-mode dark');
            }
            await db.settings.put({ key: 'darkMode', value: state.darkMode });
            
            // Re-render open internal windows to update themes
            state.activeWindows.forEach(win => {
                if (win.type === 'config') renderConfig(win.id);
                if (win.type === 'db') renderDB(win.id);
            });
        }

        async function openInternalWindow(type) {
            if (state.internalOpen[type]) return;
            state.internalOpen[type] = true;
            updateSystemNavButtons();
            createWindowCard(type === 'db' ? 'Database' : 'Settings', null, type);
        }

        function createWindowCard(title, content, type = 'module', rawHtml = null, useMiniBrowser = false) {
            const windowId = `win-${Date.now()}`;
            const isInternal = type === 'db' || type === 'config';
            
            let resolvedUrl = content;
            if (!isInternal && content) {
                const isAbsolute = /^https?:\/\//i.test(content) || content.startsWith('data:') || content.startsWith('blob:');
                if (!isAbsolute) {
                    try {
                        resolvedUrl = new URL(content, window.location.origin).href;
                    } catch(e) {
                        resolvedUrl = content;
                    }
                }
            }

            const cardHtml = `
                <div id="${windowId}" class="window-card dark:bg-slate-900 dark:border-slate-700" data-type="${type}" data-minibrowser="${useMiniBrowser}" onclick="focusWindow('${windowId}')">
                    <div class="window-header border-b border-gray-200 dark:border-slate-700 dark:bg-slate-800">
                        <span class="text-[11px] font-bold truncate opacity-80 uppercase mr-4 dark:text-slate-200">${title}</span>
                        <div class="flex items-center gap-1">
                            ${!isInternal ? `
                            <button id="btn-save-${windowId}" onclick="event.stopPropagation(); saveWindowToBookmarks('${windowId}')" class="btn-win-tool hover:text-amber-500 dark:hover:text-amber-400" title="Guardar en Base de Datos para Auto-Load">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></polygon></svg>
                            </button>
                            ` : ''}
                            <button onclick="event.stopPropagation(); toggleMinimize('${windowId}', event)" class="btn-win-tool" title="Minimizar">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/></svg>
                            </button>
                            <button onclick="event.stopPropagation(); toggleMaximize('${windowId}')" class="btn-win-tool btn-restricted" title="Maximizar">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>
                            </button>
                            <button onclick="event.stopPropagation(); toggleFullScreen('${windowId}')" class="btn-win-tool btn-restricted" title="Full Screen">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 2 2h3"/></svg>
                            </button>
                            <button onclick="event.stopPropagation(); removeWindow('${windowId}', '${type}')" class="btn-win-tool text-rose-500 hover:text-rose-600 ml-1 btn-restricted" title="Cerrar">✕</button>
                        </div>
                    </div>
                    <div class="window-body flex flex-col h-full overflow-hidden relative">
                        <div class="iframe-overlay"></div>
                        ${isInternal ? 
                            `<div id="content-${windowId}" class="p-4 h-full overflow-auto bg-white dark:bg-slate-900 text-xs font-sans"></div>` : 
                            (useMiniBrowser ? renderMiniBrowserWrapper(windowId, resolvedUrl) : `<iframe id="iframe-${windowId}" src="${resolvedUrl}" onload="inspectIframe('${windowId}')" onerror="handleIframeError('${windowId}')"></iframe>`)
                        }
                    </div>
                </div>
            `;
            
            state.activeWindows.push({ id: windowId, title: title, type: type, url: resolvedUrl, rawHtml: rawHtml, minimized: false, useMiniBrowser: useMiniBrowser });

            $('#main').append(cardHtml);
            const win = $(`#${windowId}`);
            win.css({ top: (40 + (state.activeWindows.length-1) * 24) + 'px', left: (40 + (state.activeWindows.length-1) * 24) + 'px' });
            
            if (type === 'config') {
                win.css({ width: '680px', height: '540px' });
            } else if (type === 'db') {
                win.css({ width: '600px', height: '480px' });
            }

            enableWindowInteractions(windowId);
            
            updateWindowsNav();
            focusWindow(windowId);
            
            if (type === 'db') renderDB(windowId);
            if (type === 'config') renderConfig(windowId);
        }

        function renderMiniBrowserWrapper(windowId, url) {
            return `
                <div class="flex flex-col h-full w-full bg-slate-50 dark:bg-slate-900 font-sans text-xs select-none">
                    <!-- Top MiniBrowser Navigation Bar -->
                    <div class="flex items-center gap-2 p-1.5 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 shrink-0 shadow-sm relative z-20">
                        <div class="flex items-center gap-1 text-slate-500 dark:text-slate-400">
                            <button onclick="navigateMiniBrowser('${windowId}', 'back')" class="p-1 hover:bg-slate-100 dark:hover:bg-slate-700 rounded" title="Atrás">&lt;</button>
                            <button onclick="navigateMiniBrowser('${windowId}', 'forward')" class="p-1 hover:bg-slate-100 dark:hover:bg-slate-700 rounded" title="Adelante">&gt;</button>
                            <button onclick="navigateMiniBrowser('${windowId}', 'reload')" class="p-1 hover:bg-slate-100 dark:hover:bg-slate-700 rounded" title="Recargar">↺</button>
                            <button class="p-1 hover:bg-slate-100 dark:hover:bg-slate-700 rounded" title="Historial">🕒</button>
                            <button onclick="toggleMiniBrowserBookmarksMenu('${windowId}')" class="p-1 hover:bg-amber-100 text-amber-500 rounded" title="Favoritos / Marcadores">⭐</button>
                        </div>

                        <!-- URL Address Bar -->
                        <div class="flex-1 flex items-center bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-full px-3 py-1 gap-2">
                            <span class="text-slate-400 text-[10px]">🌐</span>
                            <input type="text" id="mb-input-${windowId}" value="${escapeHtml(url)}" onkeydown="if(event.key==='Enter') applyMiniBrowserUrl('${windowId}')" class="w-full bg-transparent text-[11px] text-slate-700 dark:text-slate-200 outline-none font-mono">
                        </div>

                        <div class="flex items-center gap-1.5">
                            <button onclick="applyMiniBrowserUrl('${windowId}')" class="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded-md text-[10px] font-bold uppercase transition-colors shadow-sm">Go ➔</button>
                        </div>

                        <!-- Bookmarks Dropdown Popover -->
                        <div id="mb-bookmarks-popover-${windowId}" class="hidden absolute top-11 left-2 w-64 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-xl rounded-xl p-3 z-30 font-sans">
                            <div class="text-[10px] font-bold text-amber-600 uppercase mb-2 flex items-center justify-between border-b pb-1 dark:border-slate-700">
                                <span>Sitios Favoritos (Marcadores)</span>
                                <span class="bg-amber-100 dark:bg-amber-950 text-amber-700 dark:text-amber-300 px-1.5 py-0.5 rounded text-[8px]">Dexie Store</span>
                            </div>
                            <div id="mb-bookmarks-list-${windowId}" class="space-y-1 max-h-48 overflow-y-auto text-[10px]">
                                <div class="text-slate-400 italic text-[9px] p-1">Cargando marcadores...</div>
                            </div>
                        </div>
                    </div>

                    <!-- Main Frame Content -->
                    <div class="flex-1 relative bg-white dark:bg-slate-950 overflow-hidden">
                        <iframe id="iframe-${windowId}" src="${url}" class="w-full h-full border-none transition-transform origin-top-left" onload="inspectIframe('${windowId}')" onerror="handleIframeError('${windowId}')"></iframe>
                    </div>

                    <!-- Bottom Status Toolbar -->
                    <div class="flex items-center justify-between px-3 py-1 bg-slate-100 dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 text-[9px] font-mono shrink-0">
                        <div class="flex items-center gap-2">
                            <span class="inline-flex items-center gap-1 px-1.5 py-0.5 bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded font-bold">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                                <span id="mb-status-url-${windowId}" class="truncate max-w-[200px]">${escapeHtml(url)}</span>
                            </span>
                            <span class="px-1.5 py-0.5 bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800 rounded font-bold uppercase">MiniBrowser</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="toggleFullScreen('${windowId}')" class="px-2 py-0.5 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded uppercase text-[8px] transition-colors">Pantalla Completa</button>
                            <div class="flex items-center gap-1 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded px-1.5 py-0.5">
                                <button onclick="adjustMiniBrowserZoom('${windowId}', -0.1)" class="hover:text-indigo-600 font-bold px-1">-</button>
                                <span id="mb-zoom-val-${windowId}" class="text-[9px] font-bold">100%</span>
                                <button onclick="adjustMiniBrowserZoom('${windowId}', 0.1)" class="hover:text-indigo-600 font-bold px-1">+</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function navigateMiniBrowser(windowId, action) {
            const iframe = document.getElementById(`iframe-${windowId}`);
            if (!iframe) return;
            try {
                if (action === 'back') iframe.contentWindow.history.back();
                if (action === 'forward') iframe.contentWindow.history.forward();
                if (action === 'reload') iframe.contentWindow.location.reload();
            } catch(e) {
                if (action === 'reload') iframe.src = iframe.src;
            }
        }

        function applyMiniBrowserUrl(windowId) {
            const input = document.getElementById(`mb-input-${windowId}`);
            const iframe = document.getElementById(`iframe-${windowId}`);
            const statusUrl = document.getElementById(`mb-status-url-${windowId}`);
            if (!input || !iframe) return;
            
            let url = input.value.trim();
            if (!url) return;
            if (!/^https?:\/\//i.test(url) && !url.startsWith('data:') && !url.startsWith('blob:')) {
                url = 'https://' + url;
            }
            iframe.src = url;
            if (statusUrl) statusUrl.textContent = url;
            
            const win = state.activeWindows.find(w => w.id === windowId);
            if (win) win.url = url;
        }

        async function toggleMiniBrowserBookmarksMenu(windowId) {
            const popover = document.getElementById(`mb-bookmarks-popover-${windowId}`);
            if (!popover) return;
            
            const isHidden = popover.classList.contains('hidden');
            if (isHidden) {
                popover.classList.remove('hidden');
                const list = document.getElementById(`mb-bookmarks-list-${windowId}`);
                const bms = await db.bookmarks.toArray();
                if (!bms || bms.length === 0) {
                    list.innerHTML = `<div class="text-slate-400 italic text-[9px] p-2">Sin marcadores guardados</div>`;
                } else {
                    list.innerHTML = bms.map(bm => `
                        <div onclick="applyMiniBrowserDirectUrl('${windowId}', '${escapeHtml(bm.url)}')" class="flex items-center justify-between p-1.5 hover:bg-slate-100 dark:hover:bg-slate-700 rounded cursor-pointer transition-colors group">
                            <div class="truncate pr-2">
                                <div class="font-bold text-slate-700 dark:text-slate-200 truncate">${escapeHtml(bm.title)}</div>
                                <div class="text-[8px] text-slate-400 truncate">${escapeHtml(bm.url)}</div>
                            </div>
                            <span class="text-[9px] text-indigo-500 opacity-0 group-hover:opacity-100 font-bold">Ir ➔</span>
                        </div>
                    `).join('');
                }
            } else {
                popover.classList.add('hidden');
            }
        }

        function applyMiniBrowserDirectUrl(windowId, url) {
            const input = document.getElementById(`mb-input-${windowId}`);
            if (input) input.value = url;
            applyMiniBrowserUrl(windowId);
            const popover = document.getElementById(`mb-bookmarks-popover-${windowId}`);
            if (popover) popover.classList.add('hidden');
        }

        function adjustMiniBrowserZoom(windowId, delta) {
            const iframe = document.getElementById(`iframe-${windowId}`);
            const zoomLabel = document.getElementById(`mb-zoom-val-${windowId}`);
            if (!iframe) return;
            
            let currentScale = parseFloat(iframe.getAttribute('data-scale') || '1.0');
            currentScale = Math.min(Math.max(0.5, currentScale + delta), 2.0);
            iframe.setAttribute('data-scale', currentScale);
            iframe.style.transform = `scale(${currentScale})`;
            iframe.style.width = `${100 / currentScale}%`;
            iframe.style.height = `${100 / currentScale}%`;
            if (zoomLabel) zoomLabel.textContent = `${Math.round(currentScale * 100)}%`;
        }

        async function toggleBookmarkAutoLoad(id) {
            const bm = await db.bookmarks.get(id);
            if (bm) {
                await db.bookmarks.update(id, { autoLoad: bm.autoLoad === false ? true : false });
                if (state.focusedWindowId) renderConfig(state.focusedWindowId);
            }
        }

        async function toggleBookmarkMiniBrowser(id) {
            const bm = await db.bookmarks.get(id);
            if (bm) {
                await db.bookmarks.update(id, { useMiniBrowser: !bm.useMiniBrowser });
                if (state.focusedWindowId) renderConfig(state.focusedWindowId);
            }
        }

        function startEditBookmark(id) {
            state.editingBookmarkId = id;
            if (state.focusedWindowId) renderConfig(state.focusedWindowId);
        }

        function cancelEditBookmark() {
            state.editingBookmarkId = null;
            if (state.focusedWindowId) renderConfig(state.focusedWindowId);
        }

        async function saveEditBookmark(id) {
            const title = document.getElementById(`edit-bm-title-${id}`).value;
            const url = document.getElementById(`edit-bm-url-${id}`).value;
            if (!title || !url) return;
            await db.bookmarks.update(id, { title, url });
            state.editingBookmarkId = null;
            if (state.focusedWindowId) renderConfig(state.focusedWindowId);
        }

        async function deleteBookmark(id) {
            await db.bookmarks.delete(id);
            if (state.editingBookmarkId === id) state.editingBookmarkId = null;
            renderConfig(state.focusedWindowId);
        }

        function switchInsTab(btn, tabId) {
            const container = $(btn).closest('.ins-tabs-container');
            container.find('.ins-tab-btn').removeClass('active text-blue-600 border-blue-600').addClass('text-gray-400 border-transparent');
            $(btn).addClass('active text-blue-600 border-blue-600');
            
            container.find('.ins-tab-content').removeClass('active');
            container.find(`.ins-tab-content[data-tab="${tabId}"]`).addClass('active');
        }

        function toggleInsItem(header) {
            $(header).next('.ins-item-body').toggleClass('hidden');
            const icon = $(header).find('.toggle-icon-item');
            icon.text(icon.text() === '▼' ? '▶' : '▼');
        }

        function renderElementInspector(title, htmlContent, idPrefix) {
            const escaped = escapeHtml(htmlContent);
            const previewBlob = `
                <html>
                    <head>
                        <script src="https://cdn.tailwindcss.com"><\/script>
                        <style>body{padding:10px;font-family:sans-serif;background-image:radial-gradient(#eee 1px, transparent 1px);background-size:10px 10px;}<\/style>
                    </head>
                    <body>${htmlContent}</body>
                </html>
            `;

            return `
                <div class="border border-gray-200 dark:border-slate-700 rounded-md mb-2 overflow-hidden shadow-sm">
                    <div class="bg-gray-100 dark:bg-slate-800 p-2 flex justify-between items-center cursor-pointer hover:bg-gray-200 dark:hover:bg-slate-700" onclick="toggleInsItem(this)">
                        <span class="text-[9px] font-bold text-gray-600 dark:text-gray-300 uppercase truncate">${title}</span>
                        <span class="toggle-icon-item text-[8px]">▶</span>
                    </div>
                    <div class="ins-item-body hidden p-2 bg-white dark:bg-slate-900 ins-tabs-container">
                        <div class="flex border-b border-gray-200 dark:border-slate-700 mb-2">
                            <div class="ins-tab-btn active text-blue-600 border-blue-600" onclick="switchInsTab(this, 'code')">CODE</div>
                            <div class="ins-tab-btn" onclick="switchInsTab(this, 'preview')">PREVIEW</div>
                        </div>
                        <div class="ins-tab-content active" data-tab="code">
                            <div class="code-snippet dark:bg-slate-950 dark:text-slate-300 dark:border-slate-800">${escaped}</div>
                        </div>
                        <div class="ins-tab-content" data-tab="preview">
                            <iframe class="preview-mini-frame" srcdoc="${escapeHtml(previewBlob)}"></iframe>
                        </div>
                    </div>
                </div>
            `;
        }

        function inspectIframe(winId) {
            if (state.focusedWindowId !== winId) return;
            const winData = state.activeWindows.find(w => w.id === winId);
            const inspector = document.getElementById('inspector-root');
            
            if (!winData || winData.type === 'db' || winData.type === 'config' || winData.minimized) {
                inspector.innerHTML = `<div class="p-6 text-center text-xs opacity-40 italic">Inactivo para inspección.</div>`;
                return;
            }

            const iframe = document.getElementById(`iframe-${winId}`);
            try {
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                let html = `<div class="p-3 bg-blue-600 text-white text-[11px] font-bold mb-1 shadow-sm uppercase tracking-tighter">APP_INSPECT: ${winData.title}</div>`;

                const domTreeContent = () => `<div class="dom-tree-root text-[10px] font-mono">${buildDomTree(doc.documentElement)}</div>`;
                html += renderInspectorSection('Árbol DOM', domTreeContent, true);

                const selectedContent = () => {
                    if (state.selectedDomNodes.size === 0) return '<div class="italic text-gray-400 p-1">Ningún elemento seleccionado.</div>';
                    let items = '';
                    state.selectedDomNodes.forEach(path => {
                        try {
                            const el = getElementByPath(doc, path);
                            if (el) items += renderElementInspector(el.tagName.toLowerCase(), el.outerHTML, path);
                        } catch(e) {}
                    });
                    return items || '<div class="italic text-gray-400 p-1">Elementos no encontrados.</div>';
                };
                html += renderInspectorSection('Elementos Seleccionados', selectedContent, true);

                inspector.innerHTML = html;
            } catch(e) {
                inspector.innerHTML = `<div class="p-4 text-xs text-rose-500 font-bold">No se puede inspeccionar este módulo (Restricción CORS o documento no accesible).</div>`;
            }
        }

        function toggleMinimize(id, event) {
            if (event) event.stopPropagation();
            const win = $(`#${id}`);
            const winData = state.activeWindows.find(w => w.id === id);
            if (!winData) return;

            winData.minimized = !winData.minimized;
            if (winData.minimized) {
                win.addClass('hidden');
                if (state.focusedWindowId === id) {
                    state.focusedWindowId = null;
                    document.getElementById('inspector-root').innerHTML = '<div class="p-10 text-center opacity-30 text-xs">Selecciona una ventana para iniciar inspección.</div>';
                }
            } else {
                win.removeClass('hidden');
                focusWindow(id);
            }
            updateMinimizedTasks();
            updateWindowsNav();
        }

        function toggleFullScreen(id) {
            const el = document.getElementById(id);
            if (!el) return;
            if (!document.fullscreenElement) {
                if (el.requestFullscreen) el.requestFullscreen();
                else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        async function saveWindowToBookmarks(id) {
            const winData = state.activeWindows.find(w => w.id === id);
            if (!winData || !winData.url) return;
            
            await db.bookmarks.add({
                title: winData.title || 'Módulo Guardado',
                url: winData.url,
                autoLoad: true,
                useMiniBrowser: !!winData.useMiniBrowser
            });
            
            const btn = document.getElementById(`btn-save-${id}`);
            if (btn) {
                btn.classList.add('text-amber-500');
                btn.title = 'Guardado en Marcadores';
            }
            
            state.activeWindows.forEach(w => {
                if (w.type === 'config') renderConfig(w.id);
            });
        }

        async function addBookmark() {
            const titleInput = document.getElementById('bm-title');
            const urlInput = document.getElementById('bm-url');
            if (!titleInput || !urlInput) return;
            
            const title = titleInput.value.trim();
            let url = urlInput.value.trim();
            if (!title || !url) return;
            
            if (!/^https?:\/\//i.test(url) && !url.startsWith('.') && !url.startsWith('/')) {
                url = 'https://' + url;
            }
            
            await db.bookmarks.add({
                title: title,
                url: url,
                autoLoad: true,
                useMiniBrowser: false
            });
            
            titleInput.value = '';
            urlInput.value = '';
            
            if (state.focusedWindowId) renderConfig(state.focusedWindowId);
        }

        function updateMinimizedTasks() {
            const container = document.getElementById('minimized-tasks');
            if (!container) return;
            
            const minimized = state.activeWindows.filter(w => w.minimized);
            if (minimized.length === 0) {
                container.innerHTML = `<span class="opacity-40 italic">Sin tareas minimizadas</span>`;
                return;
            }
            
            container.innerHTML = minimized.map(win => `
                <button onclick="toggleMinimize('${win.id}', event)" class="px-2 py-1 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-300 dark:border-slate-700 rounded flex items-center gap-1.5 transition-colors">
                    ${ICONS[win.type] || ICONS.module}
                    <span class="truncate max-w-[100px] text-[9px] font-bold">${escapeHtml(win.title)}</span>
                </button>
            `).join('');
        }

        async function autoloadBookmarks() {
            const all = await db.bookmarks.toArray();
            const toLoad = all.filter(bm => bm.autoLoad !== false);
            if (toLoad.length === 0) return;
            toLoad.forEach((bm, index) => {
                setTimeout(() => {
                    createWindowCard(bm.title, bm.url, 'web', null, !!bm.useMiniBrowser);
                }, index * 150);
            });
        }

        async function openSavedModule(id) {
            const bm = await db.bookmarks.get(id);
            if (bm) {
                createWindowCard(bm.title, bm.url, 'web', null, !!bm.useMiniBrowser);
            }
        }

        function handleIframeError(winId) {
            console.warn(`Frame error on window ${winId}`);
        }

        function renderInspectorSection(title, contentFn, autoActive = false) {
            return `<div class="inspector-item border-b border-gray-200 dark:border-slate-800"><div class="inspector-section-header" onclick="toggleInspectorItem(this)"><span>${title}</span><span class="toggle-icon text-[8px]">${autoActive ? '▼' : '▶'}</span></div><div class="inspector-section-content ${autoActive ? 'active' : ''} dark:bg-slate-900 dark:text-slate-300">${contentFn()}</div></div>`;
        }

        function buildDomTree(element, path = "0") {
            const children = Array.from(element.children).filter(el => !['SCRIPT', 'STYLE'].includes(el.tagName));
            const hasChildren = children.length > 0;
            const nodeName = element.tagName.toLowerCase();
            let html = `<div class="dom-tree-item"><div class="dom-tree-label"><span class="dom-tree-toggle" onclick="toggleTreeNode(event, this)">${hasChildren ? '▼' : '&nbsp;'}</span><input type="checkbox" class="w-3 h-3 rounded border-gray-300" ${state.selectedDomNodes.has(path) ? 'checked' : ''} onchange="handleNodeCheck(this, '${state.focusedWindowId}', '${path}')"><span class="text-blue-600 dark:text-blue-400 font-bold">&lt;${nodeName}&gt;</span></div>`;
            if (hasChildren) {
                html += `<div class="dom-tree-node">`;
                children.forEach((child, index) => html += buildDomTree(child, `${path}-${index}`));
                html += `</div>`;
            }
            html += `</div>`;
            return html;
        }

        function handleNodeCheck(checkbox, winId, nodePath) {
            if (checkbox.checked) state.selectedDomNodes.add(nodePath);
            else state.selectedDomNodes.delete(nodePath);
            inspectIframe(winId);
        }

        function getElementByPath(doc, path) {
            const indices = path.split('-').map(Number);
            let current = doc.documentElement;
            for (let i = 1; i < indices.length; i++) {
                const cleanChildren = Array.from(current.children).filter(el => !['SCRIPT', 'STYLE'].includes(el.tagName));
                current = cleanChildren[indices[i]];
            }
            return current;
        }

        function toggleInspectorItem(header) {
            $(header).next('.inspector-section-content').toggleClass('active');
            const icon = $(header).find('.toggle-icon');
            icon.text(icon.text() === '▼' ? '▶' : '▼');
        }

        function toggleTreeNode(event, node) {
            event.stopPropagation();
            const children = $(node).closest('.dom-tree-item').find('> .dom-tree-node');
            children.toggleClass('hidden');
            $(node).text(children.hasClass('hidden') ? '▶' : '▼');
        }

        function focusWindow(id) {
            const winData = state.activeWindows.find(w => w.id === id);
            if (!winData) return;

            if (winData.minimized) {
                toggleMinimize(id);
                return;
            }

            $('.window-card').css('z-index', 10);
            $(`#${id}`).css('z-index', 50);
            state.focusedWindowId = id;
            updateWindowsNav();
            
            if ($(`#${id}`).data('type') === 'config') renderConfig(id);
            else if ($(`#${id}`).data('type') === 'db') renderDB(id);
            else inspectIframe(id);
        }

        function removeWindow(id, type) {
            $(`#${id}`).remove();
            state.activeWindows = state.activeWindows.filter(w => w.id !== id);
            if (type === 'db') state.internalOpen.db = false;
            if (type === 'config') state.internalOpen.config = false;
            updateSystemNavButtons();
            updateWindowsNav();
            updateMinimizedTasks();
            if (state.focusedWindowId === id) {
                state.focusedWindowId = null;
                document.getElementById('inspector-root').innerHTML = '<div class="p-10 text-center opacity-30 text-xs">Esperando selección...</div>';
            }
        }

        function toggleSection(id) {
            const c = (id === 'header' || id === 'footer') ? 'collapsed-h' : 'collapsed-w';
            const section = $(`#${id}`);
            section.toggleClass(c);
            if (id === 'aside') $('#aside-expand-btn').toggleClass('hidden', !section.hasClass(c));
            else if (id === 'header') $('#header-expand-btn').toggle(section.hasClass(c));
            else if (id === 'footer') $('#footer-expand-btn').toggle(section.hasClass(c));
        }

        function toggleNav() { $('#nav').toggleClass('nav-expanded nav-collapsed'); }
        function updateSystemNavButtons() {
            $('#btn-nav-db').toggleClass('btn-nav-locked', state.internalOpen.db);
            $('#btn-nav-config').toggleClass('btn-nav-locked', state.internalOpen.config);
        }

        function minimizeAllWindows() {
            state.activeWindows.forEach(win => {
                win.minimized = true;
                $(`#${win.id}`).addClass('hidden');
            });
            state.focusedWindowId = null;
            document.getElementById('inspector-root').innerHTML = '<div class="p-10 text-center opacity-30 text-xs">Selecciona una ventana para iniciar inspección.</div>';
            updateMinimizedTasks();
            updateWindowsNav();
        }

        function restoreAllWindows() {
            state.activeWindows.forEach(win => {
                win.minimized = false;
                $(`#${win.id}`).removeClass('hidden');
            });
            if (state.activeWindows.length > 0) {
                focusWindow(state.activeWindows[state.activeWindows.length - 1].id);
            }
            updateMinimizedTasks();
            updateWindowsNav();
        }

        function closeAllWindows() {
            const windowsToClose = [...state.activeWindows];
            windowsToClose.forEach(win => {
                $(`#${win.id}`).remove();
                if (win.type === 'db') state.internalOpen.db = false;
                if (win.type === 'config') state.internalOpen.config = false;
            });
            state.activeWindows = [];
            state.focusedWindowId = null;
            document.getElementById('inspector-root').innerHTML = '<div class="p-10 text-center opacity-30 text-xs">Esperando selección...</div>';
            updateSystemNavButtons();
            updateWindowsNav();
            updateMinimizedTasks();
        }

        function updateWindowsNav() {
            const container = document.getElementById('win-links-container');
            if (!container) return;
            if (state.activeWindows.length === 0) {
                container.innerHTML = `<p class="nav-text text-[10px] text-gray-400 dark:text-slate-500 italic p-2 text-center">Sin ventanas abiertas</p>`;
                return;
            }
            container.innerHTML = state.activeWindows.map(win => `
                <div onclick="focusWindow('${win.id}')" class="group flex items-center justify-between px-2.5 py-1.5 text-[10px] rounded cursor-pointer transition-colors ${state.focusedWindowId === win.id ? 'bg-blue-50 dark:bg-slate-800 text-blue-600 dark:text-blue-400 font-bold border-l-2 border-blue-600 dark:border-blue-400' : 'hover:bg-gray-100 dark:hover:bg-slate-800/50 text-slate-700 dark:text-slate-300'}">
                    <div class="flex items-center gap-2 truncate min-w-0">
                        ${ICONS[win.type] || ICONS.module}
                        <span class="nav-text truncate uppercase ${win.minimized ? 'line-through opacity-60' : ''}">${escapeHtml(win.title)}</span>
                    </div>
                    <div class="win-controls flex items-center gap-1 opacity-80 group-hover:opacity-100 shrink-0 ml-1">
                        <button onclick="event.stopPropagation(); toggleMinimize('${win.id}', event)" class="p-1 hover:bg-slate-200 dark:hover:bg-slate-700 rounded text-slate-500 dark:text-slate-400" title="${win.minimized ? 'Restaurar' : 'Minimizar'}">
                            ${win.minimized ? 
                                `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>` : 
                                `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/></svg>`
                            }
                        </button>
                        <button onclick="event.stopPropagation(); removeWindow('${win.id}', '${win.type}')" class="p-1 hover:bg-rose-100 dark:hover:bg-rose-900/50 rounded text-rose-500" title="Cerrar">
                            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function handleUrlSubmit() {
            let url = document.getElementById('external-url').value;
            if(!url) return;
            const isRelative = url.startsWith('.') || url.startsWith('/');
            const hasProtocol = /^https?:\/\//i.test(url) || url.startsWith('blob:');
            if(!isRelative && !hasProtocol) url = 'https://' + url;
            createWindowCard(url.split('//')[1] || url, url, 'web');
            document.getElementById('external-url').value = '';
        }

        function handleHtmlUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const rawContent = e.target.result;
                const blob = new Blob([rawContent], { type: 'text/html' });
                const blobUrl = URL.createObjectURL(blob);
                createWindowCard(file.name, blobUrl, 'module', rawContent);
            };
            reader.readAsText(file);
        }

        function escapeHtml(text) {
            if(!text) return "";
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

            async function existeRegistro(tabla, campo, valor) {
                try {
                    // .count() es más rápido que traer todo el objeto con .first() o .toArray()
                    const total = await db[tabla].where(campo).equals(valor).count();
                    return total > 0;
                } catch (error) {
                    console.error("Error al comprobar la base de datos:", error);
                    return false;
                }
            }

            // ==========================================
            // Ejemplo de uso (dentro de una función async)
            // ==========================================
            async function registrarUsuario(titulo, url) {
                const emailABuscar = url; // Aquí puedes cambiar a cualquier valor que quieras buscar

                const existe = await existeRegistro('bookmarks', 'url', emailABuscar);

                if (existe) {
                    console.log('El correo ya está registrado.');
                } else {

                    console.log('El correo está disponible.');
                             db.bookmarks.add({
                title: titulo,
                url: url,
                autoLoad: true,
                useMiniBrowser: true
            });
                }
            }
            async function eliminarRegistrosQueEmpiezanPor(tabla, campo, prefijo) {
                try {
                    // .where().startsWith() aprovecha el índice de IndexedDB de forma muy eficiente
                    const cantidadEliminados = await db[tabla]
                    .where(campo)
                    .startsWith(prefijo)
                    .delete();

                    console.log(`Operación completada. Se eliminaron ${cantidadEliminados} registros.`);
                    return cantidadEliminados;
                } catch (error) {
                    console.error("Error al eliminar los registros:", error);
                    return 0;
                }
                }

                // ==========================================
                // Ejemplo de uso
                // ==========================================
                async function limpiarBaseDeDatos() {
                // Borrará registros como "blob-123", "blob_imagen.png", "blob", etc.
                await eliminarRegistrosQueEmpiezanPor('bookmarks', 'url', 'blob');
